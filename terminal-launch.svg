<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" width="1200" height="260" role="img" aria-label="launch the interactive terminal">
  <defs>
    <linearGradient id="tlbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0D1320"/>
      <stop offset="1" stop-color="#070A0F"/>
    </linearGradient>
    <linearGradient id="tlbar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#161D2B"/>
      <stop offset="1" stop-color="#0F1521"/>
    </linearGradient>
    <linearGradient id="tlcta" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4FD6FF"/>
      <stop offset="1" stop-color="#7EE787"/>
    </linearGradient>
    <linearGradient id="tlsheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="tlscan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4FD6FF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#4FD6FF" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#4FD6FF" stop-opacity="0"/>
    </linearGradient>
    <filter id="tlglow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="tlglow2" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
  </defs>
  <style>
    .mono{font-family:'JetBrains Mono','Fira Code',ui-monospace,Menlo,Consolas,monospace;}
    .disp{font-family:'JetBrains Mono','Fira Code',ui-monospace,Menlo,Consolas,monospace;font-weight:700;}
    @media (prefers-reduced-motion:reduce){animate,animateTransform{display:none}}
  </style>

  <rect width="1200" height="260" fill="url(#tlbg)"/>

  <!-- terminal window shell -->
  <rect x="40" y="20" width="1120" height="220" rx="14" fill="#0B1018" stroke="#1A2332" stroke-width="1.5" filter="url(#tlglow2)"/>

  <!-- title bar -->
  <path d="M40 34a14 14 0 0 1 14-14h1092a14 14 0 0 1 14 14v30H40z" fill="url(#tlbar)"/>
  <circle cx="64" cy="42" r="5.5" fill="#FF5F57"/>
  <circle cx="84" cy="42" r="5.5" fill="#FEBC2E"/>
  <circle cx="104" cy="42" r="5.5" fill="#28C840"/>
  <text x="600" y="46" class="mono" font-size="12" fill="#5B6675" text-anchor="middle">dhruv@memory.bin: ~</text>
  <circle cx="1140" cy="42" r="3" fill="#7EE787" filter="url(#tlglow2)">
    <animate attributeName="opacity" values="1;0.3;1" dur="1.8s" repeatCount="indefinite"/>
  </circle>

  <!-- vertical scanning beam inside terminal -->
  <rect x="40" y="64" width="1120" height="176" fill="url(#tlscan)" opacity="0.5">
    <animate attributeName="y" values="64;200;64" dur="6s" repeatCount="indefinite"/>
  </rect>

  <!-- scanline texture -->
  <g opacity="0.06">
    <rect x="40" y="68" width="1120" height="2" fill="#4FD6FF"/>
    <rect x="40" y="74" width="1120" height="2" fill="#4FD6FF"/>
    <rect x="40" y="80" width="1120" height="2" fill="#4FD6FF"/>
  </g>

  <!-- typed boot lines -->
  <g class="mono" font-size="14">
    <text x="60" y="100" fill="#7EE787" opacity="0">$
      <animate attributeName="opacity" values="0;1" dur="0.2s" begin="0.3s" fill="freeze"/>
    </text>
    <text x="76" y="100" fill="#E6EDF3" opacity="0">./launch --interactive
      <animate attributeName="opacity" values="0;1" dur="0.2s" begin="0.5s" fill="freeze"/>
    </text>
    <text x="60" y="124" fill="#5B6675" opacity="0">initializing memory.bin
      <animate attributeName="opacity" values="0;1" dur="0.2s" begin="1.0s" fill="freeze"/>
      <animate attributeName="fill" values="#5B6675;#5B6675;#7EE787" keyTimes="0;0.8;1" dur="1.5s" begin="1.0s" fill="freeze"/>
    </text>
    <text x="280" y="124" fill="#7EE787" opacity="0">[ ok ]
      <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.6;1" dur="1.6s" begin="1.0s" fill="freeze"/>
    </text>
    <text x="60" y="148" fill="#5B6675" opacity="0">loading 7 games · 40 easter eggs
      <animate attributeName="opacity" values="0;1" dur="0.2s" begin="1.5s" fill="freeze"/>
    </text>
  </g>

  <!-- blinking cursor -->
  <rect x="60" y="158" width="9" height="16" fill="#4FD6FF" filter="url(#tlglow2)">
    <animate attributeName="opacity" values="1;0;1" dur="0.6s" begin="2s" repeatCount="indefinite"/>
  </rect>

  <!-- ready line -->
  <text x="60" y="184" class="mono" font-size="13" fill="#4FD6FF" opacity="0" filter="url(#tlglow2)">
    ready. press enter.
    <animate attributeName="opacity" values="0;1" dur="0.3s" begin="2.2s" fill="freeze"/>
  </text>

  <!-- CTA button with pulsing glow -->
  <g transform="translate(600,218)" opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.4s" begin="2.5s" fill="freeze"/>
    <!-- glow ring -->
    <rect x="-175" y="-22" width="350" height="44" rx="22" fill="none" stroke="url(#tlcta)" stroke-width="1" opacity="0.4" filter="url(#tlglow)">
      <animate attributeName="opacity" values="0.2;0.6;0.2" dur="2s" repeatCount="indefinite"/>
    </rect>
    <!-- button body -->
    <rect x="-175" y="-22" width="350" height="44" rx="22" fill="#0A1A14" stroke="url(#tlcta)" stroke-width="2"/>
    <!-- sheen sweep -->
    <rect x="-175" y="-22" width="100" height="44" rx="22" fill="url(#tlsheen)" opacity="0">
      <animate attributeName="x" values="-175;75;-175" dur="3s" begin="2.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.6;0" dur="3s" begin="2.8s" repeatCount="indefinite"/>
    </rect>
    <!-- text -->
    <text y="6" class="disp" font-size="15" fill="#E6EDF3" text-anchor="middle" letter-spacing="2">LAUNCH INTERACTIVE TERMINAL</text>
    <!-- arrow -->
    <path d="M125,0 L145,0 M138,-6 L145,0 L138,6" stroke="#4FD6FF" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" filter="url(#tlglow2)">
      <animate attributeName="opacity" values="1;0.4;1" dur="1.5s" repeatCount="indefinite"/>
      <animate attributeName="transform" type="translate" values="0,0;4,0;0,0" dur="1.5s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- bottom hint -->
  <text x="60" y="248" class="mono" font-size="10" fill="#4A5668">one file · no build step · just html</text>
  <text x="1160" y="248" class="mono" font-size="10" fill="#4A5668" text-anchor="end">click anywhere</text>
</svg>
