  <text x="40" y="30" class="mono" font-size="13" fill="#7D8590">// commits slithering through the heap</text>
  <text x="1160" y="184" class="mono" font-size="10" fill="#4A5668" text-anchor="end">1,284 contributions · 365d</text>
