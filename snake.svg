<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 240" width="1200" height="240" role="img" aria-label="self-playing snake game">
  <defs>
    <linearGradient id="snbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0A0F16"/>
      <stop offset="1" stop-color="#06080C"/>
    </linearGradient>
    <radialGradient id="snfood" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFB454"/>
      <stop offset="0.5" stop-color="#FFB454" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#FFB454" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="snbody" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4FD6FF" stop-opacity="0.3"/>
      <stop offset="0.5" stop-color="#4FD6FF"/>
      <stop offset="1" stop-color="#E6EDF3"/>
    </linearGradient>
    <filter id="snglow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="snbigglow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
  </defs>
  <style>
    .mono{font-family:'JetBrains Mono','Fira Code',ui-monospace,Menlo,Consolas,monospace;font-weight:700;}
    .lbl{font-family:'JetBrains Mono','Fira Code',ui-monospace,Menlo,Consolas,monospace;}
    @media (prefers-reduced-motion:reduce){animate,animateMotion,animateTransform{display:none}}
  </style>

  <rect width="1200" height="240" fill="url(#snbg)"/>

  <!-- header -->
  <text x="40" y="28" class="mono" font-size="13" fill="#7D8590">// snake.exe -autoplay</text>
  <text x="1160" y="28" class="lbl" font-size="11" fill="#4A5668" text-anchor="end">self-playing · neural pathfinding</text>

  <!-- game board background -->
  <rect x="40" y="44" width="1120" height="160" rx="8" fill="#040608" stroke="#101820" stroke-width="1"/>

  <!-- grid lines -->
  <g stroke="#0E131C" stroke-width="1" opacity="0.5">
    <line x1="120" y1="44" x2="120" y2="204"/>
    <line x1="200" y1="44" x2="200" y2="204"/>
    <line x1="280" y1="44" x2="280" y2="204"/>
    <line x1="360" y1="44" x2="360" y2="204"/>
    <line x1="440" y1="44" x2="440" y2="204"/>
    <line x1="520" y1="44" x2="520" y2="204"/>
    <line x1="600" y1="44" x2="600" y2="204"/>
    <line x1="680" y1="44" x2="680" y2="204"/>
    <line x1="760" y1="44" x2="760" y2="204"/>
    <line x1="840" y1="44" x2="840" y2="204"/>
    <line x1="920" y1="44" x2="920" y2="204"/>
    <line x1="1000" y1="44" x2="1000" y2="204"/>
    <line x1="1080" y1="44" x2="1080" y2="204"/>
    <line x1="40" y1="84" x2="1160" y2="84"/>
    <line x1="40" y1="124" x2="1160" y2="124"/>
    <line x1="40" y1="164" x2="1160" y2="164"/>
  </g>

  <!-- food dot 1 (appears, gets eaten, respawns) -->
  <g>
    <circle cx="640" cy="104" r="12" fill="url(#snfood)" filter="url(#snbigglow)">
      <animate attributeName="r" values="8;12;8" dur="1.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;1;1;0;0;0;1" keyTimes="0;0.15;0.18;0.2;0.5;0.55;1" dur="6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="640" cy="104" r="5" fill="#FFB454" filter="url(#snglow)">
      <animate attributeName="opacity" values="1;1;0;0;0;1" keyTimes="0;0.18;0.2;0.5;0.55;1" dur="6s" repeatCount="indefinite"/>
    </circle>
    <!-- respawn flash -->
    <circle cx="640" cy="104" r="0" fill="none" stroke="#FFB454" stroke-width="2" opacity="0">
      <animate attributeName="r" values="0;20;0" keyTimes="0;0.5;1" dur="0.4s" begin="3.3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;0;0" keyTimes="0;0.5;1" dur="0.4s" begin="3.3s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- food dot 2 -->
  <g>
    <circle cx="920" cy="144" r="12" fill="url(#snfood)" filter="url(#snbigglow)">
      <animate attributeName="r" values="8;12;8" dur="1.3s" begin="0.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0;0;1;1;1;0;0" keyTimes="0;0.18;0.2;0.22;0.5;0.53;0.55;1" dur="6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="920" cy="144" r="5" fill="#FFB454" filter="url(#snglow)">
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.2;0.22;0.53;0.55;1" dur="6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="920" cy="144" r="0" fill="none" stroke="#FFB454" stroke-width="2" opacity="0">
      <animate attributeName="r" values="0;20;0" keyTimes="0;0.5;1" dur="0.4s" begin="0.3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;0;0" keyTimes="0;0.5;1" dur="0.4s" begin="0.3s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- food dot 3 -->
  <g>
    <circle cx="280" cy="64" r="12" fill="url(#snfood)" filter="url(#snbigglow)">
      <animate attributeName="r" values="8;12;8" dur="1.4s" begin="0.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0;1;1;0;0;0;1" keyTimes="0;0.5;0.52;0.85;0.88;0.9;0.95;1" dur="6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="280" cy="64" r="5" fill="#FFB454" filter="url(#snglow)">
      <animate attributeName="opacity" values="0;0;1;1;0;0;1" keyTimes="0;0.5;0.52;0.85;0.88;0.9;1" dur="6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="280" cy="64" r="0" fill="none" stroke="#FFB454" stroke-width="2" opacity="0">
      <animate attributeName="r" values="0;20;0" keyTimes="0;0.5;1" dur="0.4s" begin="5.1s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;0;0" keyTimes="0;0.5;1" dur="0.4s" begin="5.1s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- THE SNAKE: head + 6 body segments, each following the previous along the grid path -->
  <!-- Path: starts left, goes right eating dot1 at (640,104), continues right eating dot2 at (920,144), loops back, goes left eating dot3 at (280,64), repeats -->
  <!-- Grid cell = 80px, rows at y=64,104,144,184 -->

  <!-- snake path (the route the head follows) -->
  <path id="snakeRoute" d="M 80,124 L 200,124 L 200,104 L 640,104 L 640,144 L 920,144 L 920,84 L 1080,84 L 1080,184 L 280,184 L 280,64 L 120,64 L 120,124 L 80,124" fill="none" stroke="none"/>

  <!-- body segments (trailing behind head, each slightly delayed) -->
  <g filter="url(#snglow)">
    <rect x="-8" y="-8" width="16" height="16" rx="4" fill="#4FD6FF" opacity="0.25">
      <animateMotion dur="6s" begin="-0.6s" repeatCount="indefinite" rotate="auto"><mpath href="#snakeRoute"/></animateMotion>
    </rect>
    <rect x="-8" y="-8" width="16" height="16" rx="4" fill="#4FD6FF" opacity="0.35">
      <animateMotion dur="6s" begin="-0.5s" repeatCount="indefinite" rotate="auto"><mpath href="#snakeRoute"/></animateMotion>
    </rect>
    <rect x="-8" y="-8" width="16" height="16" rx="4" fill="#4FD6FF" opacity="0.5">
      <animateMotion dur="6s" begin="-0.4s" repeatCount="indefinite" rotate="auto"><mpath href="#snakeRoute"/></animateMotion>
    </rect>
    <rect x="-8" y="-8" width="16" height="16" rx="4" fill="#5FC8E8" opacity="0.65">
      <animateMotion dur="6s" begin="-0.3s" repeatCount="indefinite" rotate="auto"><mpath href="#snakeRoute"/></animateMotion>
    </rect>
    <rect x="-8" y="-8" width="16" height="16" rx="4" fill="#7FACD8" opacity="0.8">
      <animateMotion dur="6s" begin="-0.2s" repeatCount="indefinite" rotate="auto"><mpath href="#snakeRoute"/></animateMotion>
    </rect>
    <rect x="-8" y="-8" width="16" height="16" rx="4" fill="#8F9ED0" opacity="0.9">
      <animateMotion dur="6s" begin="-0.1s" repeatCount="indefinite" rotate="auto"><mpath href="#snakeRoute"/></animateMotion>
    </rect>
  </g>

  <!-- snake head (brightest, leads the trail) -->
  <g filter="url(#snglow)">
    <rect x="-11" y="-11" width="22" height="22" rx="5" fill="#E6EDF3" opacity="0.3">
      <animateMotion dur="6s" begin="0s" repeatCount="indefinite" rotate="auto"><mpath href="#snakeRoute"/></animateMotion>
    </rect>
    <rect x="-9" y="-9" width="18" height="18" rx="4" fill="#4FD6FF">
      <animateMotion dur="6s" begin="0s" repeatCount="indefinite" rotate="auto"><mpath href="#snakeRoute"/></animateMotion>
    </rect>
    <!-- eyes (white dots that travel with head) -->
    <circle r="2" fill="#040608">
      <animateMotion dur="6s" begin="0s" repeatCount="indefinite" rotate="auto"><mpath href="#snakeRoute"/></animateMotion>
    </circle>
  </g>

  <!-- eat flash bursts at food locations when snake passes -->
  <circle cx="640" cy="104" r="0" fill="none" stroke="#FFB454" stroke-width="3" opacity="0" filter="url(#snbigglow)">
    <animate attributeName="r" values="0;30;0" keyTimes="0;0.4;1" dur="0.5s" begin="1.9s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.9;0;0" keyTimes="0;0.4;1" dur="0.5s" begin="1.9s" repeatCount="indefinite"/>
  </circle>
  <circle cx="920" cy="144" r="0" fill="none" stroke="#FFB454" stroke-width="3" opacity="0" filter="url(#snbigglow)">
    <animate attributeName="r" values="0;30;0" keyTimes="0;0.4;1" dur="0.5s" begin="3.3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.9;0;0" keyTimes="0;0.4;1" dur="0.5s" begin="3.3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="280" cy="64" r="0" fill="none" stroke="#FFB454" stroke-width="3" opacity="0" filter="url(#snbigglow)">
    <animate attributeName="r" values="0;30;0" keyTimes="0;0.4;1" dur="0.5s" begin="5.1s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.9;0;0" keyTimes="0;0.4;1" dur="0.5s" begin="5.1s" repeatCount="indefinite"/>
  </circle>

  <!-- score counter -->
  <g class="mono" font-size="13">
    <text x="40" y="228" fill="#5B6675">score:</text>
    <text x="92" y="228" fill="#7EE787" opacity="0">
      000
      <animate attributeName="opacity" values="0;1" dur="0.3s" begin="0.1s" fill="freeze"/>
      <animate attributeName="textContent" values="000;000;010;010;020;020;030;030" keyTimes="0;0.31;0.33;0.55;0.57;0.85;0.87;1" dur="6s" begin="0s" repeatCount="indefinite"/>
    </text>
    <text x="160" y="228" fill="#5B6675">length:</text>
    <text x="216" y="228" fill="#4FD6FF" opacity="0">
      7
      <animate attributeName="opacity" values="0;1" dur="0.3s" begin="0.1s" fill="freeze"/>
    </text>
    <text x="1160" y="228" fill="#4A5668" text-anchor="end">a* pathfinding · auto</text>
  </g>
</svg>
