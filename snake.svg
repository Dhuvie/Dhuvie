<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 200" width="1200" height="200" role="img" aria-label="contribution snake">
  <defs>
    <linearGradient id="snbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0B1018"/>
      <stop offset="1" stop-color="#06080C"/>
    </linearGradient>
    <radialGradient id="snhead" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#4FD6FF"/>
      <stop offset="0.5" stop-color="#4FD6FF" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#4FD6FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sntrail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4FD6FF" stop-opacity="0"/>
      <stop offset="0.7" stop-color="#4FD6FF" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#E6EDF3"/>
    </linearGradient>
    <filter id="snglow" x="-50%" y="-50%" width="200%" height="200%">
