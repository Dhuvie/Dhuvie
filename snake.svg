  <!-- snake trail (fading segments) -->
  <g>
    <circle r="8" fill="#4FD6FF" opacity="0.15" filter="url(#snglow)"><animateMotion dur="5s" begin="-0.8s" repeatCount="indefinite"><mpath href="#snakePath3"/></animateMotion></circle>
    <circle r="7" fill="#4FD6FF" opacity="0.25" filter="url(#snglow)"><animateMotion dur="5s" begin="-0.65s" repeatCount="indefinite"><mpath href="#snakePath3"/></animateMotion></circle>
    <circle r="6.5" fill="#5FC8E8" opacity="0.4" filter="url(#snglow)"><animateMotion dur="5s" begin="-0.5s" repeatCount="indefinite"><mpath href="#snakePath3"/></animateMotion></circle>
    <circle r="6" fill="#6FBAE0" opacity="0.55" filter="url(#snglow)"><animateMotion dur="5s" begin="-0.35s" repeatCount="indefinite"><mpath href="#snakePath3"/></animateMotion></circle>
    <circle r="5.5" fill="#7FACD8" opacity="0.7" filter="url(#snglow)"><animateMotion dur="5s" begin="-0.2s" repeatCount="indefinite"><mpath href="#snakePath3"/></animateMotion></circle>
    <circle r="5" fill="#8F9ED0" opacity="0.8" filter="url(#snglow)"><animateMotion dur="5s" begin="-0.1s" repeatCount="indefinite"><mpath href="#snakePath3"/></animateMotion></circle>
    <!-- head with glow -->
    <circle r="14" fill="url(#snhead)" filter="url(#snglow)"><animateMotion dur="5s" begin="0s" repeatCount="indefinite"><mpath href="#snakePath3"/></animateMotion></circle>
    <circle r="6" fill="#E6EDF3" filter="url(#snglow)"><animateMotion dur="5s" begin="0s" repeatCount="indefinite"><mpath href="#snakePath3"/></animateMotion></circle>
  </g>

  <!-- dots that get eaten (appear and shrink as head passes) -->
  <g fill="#FFB454" filter="url(#snglow)">
    <circle cx="240" cy="100" r="3"><animate attributeName="r" values="3;3;0;3" keyTimes="0;0.18;0.2;0.25" dur="5s" repeatCount="indefinite"/></circle>
    <circle cx="440" cy="100" r="3"><animate attributeName="r" values="3;3;0;3" keyTimes="0;0.36;0.38;0.43" dur="5s" repeatCount="indefinite"/></circle>
    <circle cx="640" cy="100" r="3"><animate attributeName="r" values="3;3;0;3" keyTimes="0;0.54;0.56;0.61" dur="5s" repeatCount="indefinite"/></circle>
