<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 200" width="1200" height="200" role="img" aria-label="manifesto">
  <defs>
    <linearGradient id="qbg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#06080C"/>
      <stop offset="0.5" stop-color="#0A0F16"/>
      <stop offset="1" stop-color="#06080C"/>
    </linearGradient>
    <linearGradient id="qtxt" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5B6675"/>
      <stop offset="0.15" stop-color="#E6EDF3"/>
      <stop offset="0.5" stop-color="#4FD6FF"/>
      <stop offset="0.85" stop-color="#E6EDF3"/>
      <stop offset="1" stop-color="#5B6675"/>
    </linearGradient>
    <linearGradient id="qunder" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4FD6FF" stop-opacity="0"/>
      <stop offset="0.3" stop-color="#4FD6FF"/>
      <stop offset="0.7" stop-color="#7EE787"/>
      <stop offset="1" stop-color="#7EE787" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="qglow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#4FD6FF" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#4FD6FF" stop-opacity="0"/>
    </radialGradient>
    <filter id="qfuzz" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5"/>
    </filter>
    <filter id="qbigglow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <style>
    .mono{font-family:'JetBrains Mono','Fira Code',ui-monospace,Menlo,Consolas,monospace;font-weight:700;}
    @media (prefers-reduced-motion:reduce){animate,animateTransform{display:none}}
  </style>

  <rect width="1200" height="200" fill="url(#qbg)"/>

  <!-- ambient glow -->
  <ellipse cx="600" cy="90" rx="480" ry="50" fill="url(#qglow)" filter="url(#qbigglow)">
    <animate attributeName="opacity" values="0.3;0.7;0.3" dur="4s" repeatCount="indefinite"/>
  </ellipse>

  <!-- ghost quote marks -->
  <text x="80" y="70" class="mono" font-size="80" fill="#141C28" opacity="0.8">"</text>
  <text x="1120" y="160" class="mono" font-size="80" fill="#141C28" opacity="0.8" text-anchor="end">"</text>

  <!-- RGB glitch copies during reveal -->
  <text x="600" y="98" class="mono" font-size="26" fill="#FF3B6B" text-anchor="middle" letter-spacing="2" opacity="0" filter="url(#qfuzz)">
    a model that compiles is not a model that ships.
    <animate attributeName="opacity" values="0;0.5;0.2;0.4;0.1;0.3;0;0;0" keyTimes="0;0.01;0.04;0.08;0.12;0.16;0.2;0.95;1" dur="6s" begin="0.3s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="translate" values="0,0;-2,0;1,0;0,0;-2,0;0,0;0,0;0,0;0,0" dur="0.2s" begin="0.3s" repeatCount="indefinite"/>
  </text>
  <text x="600" y="98" class="mono" font-size="26" fill="#4FD6FF" text-anchor="middle" letter-spacing="2" opacity="0" filter="url(#qfuzz)">
    a model that compiles is not a model that ships.
    <animate attributeName="opacity" values="0;0.5;0.2;0.4;0.1;0.3;0;0;0" keyTimes="0;0.01;0.04;0.08;0.12;0.16;0.2;0.95;1" dur="6s" begin="0.3s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="translate" values="0,0;2,0;-1,0;0,0;2,0;0,0;0,0;0,0;0,0" dur="0.2s" begin="0.3s" repeatCount="indefinite"/>
  </text>

  <!-- main text -->
  <text x="600" y="98" class="mono" font-size="26" fill="url(#qtxt)" text-anchor="middle" letter-spacing="2" opacity="0" filter="url(#qfuzz)">
    a model that compiles is not a model that ships.
    <animate attributeName="opacity" values="0;0;0.3;1;1" keyTimes="0;0.28;0.32;0.38;1" dur="6s" begin="0.3s" repeatCount="indefinite"/>
  </text>

  <!-- underline -->
  <rect x="350" y="116" width="0" height="2" fill="url(#qunder)" filter="url(#qfuzz)">
    <animate attributeName="width" from="0" to="500" dur="0.8s" begin="2.5s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.2 0.8 0.2 1"/>
  </rect>

  <!-- label -->
  <text x="600" y="146" class="mono" font-size="11" fill="#4A5668" text-anchor="middle" letter-spacing="6" opacity="0">
    .MANIFESTO
    <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.42;0.46" dur="6s" begin="0.3s" repeatCount="indefinite"/>
  </text>

  <!-- traveling cursor -->
  <rect x="180" y="82" width="3" height="22" fill="#4FD6FF" opacity="0" filter="url(#qfuzz)">
    <animate attributeName="opacity" values="0;1;1;0;1" keyTimes="0;0.02;0.38;0.40;1" dur="6s" begin="0.3s" repeatCount="indefinite"/>
    <animate attributeName="x" values="180;180;890;890" keyTimes="0;0.02;0.38;1" dur="6s" begin="0.3s" repeatCount="indefinite"/>
  </rect>

  <!-- particles -->
  <g fill="#4FD6FF" opacity="0.5">
    <circle r="1.5" filter="url(#qfuzz)"><animateMotion dur="9s" repeatCount="indefinite" path="M100,40 Q400,80 700,30 T1100,60"/></circle>
    <circle r="1" fill="#7EE787" filter="url(#qfuzz)"><animateMotion dur="11s" begin="4s" repeatCount="indefinite" path="M1100,160 Q700,120 400,170 T100,140"/></circle>
  </g>
</svg>
