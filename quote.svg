<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 160" width="1200" height="160" role="img" aria-label="manifesto">
  <defs>
    <linearGradient id="qbg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#070A0F"/>
      <stop offset="0.5" stop-color="#0D1320"/>
      <stop offset="1" stop-color="#070A0F"/>
    </linearGradient>
    <linearGradient id="txtGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7D8590"/>
      <stop offset="0.3" stop-color="#E6EDF3"/>
      <stop offset="0.7" stop-color="#E6EDF3"/>
      <stop offset="1" stop-color="#7D8590"/>
    </linearGradient>
    <linearGradient id="underline" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4FD6FF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#4FD6FF"/>
      <stop offset="1" stop-color="#4FD6FF" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="qtype">
      <rect x="0" y="40" width="0" height="80">
        <animate attributeName="width" from="0" to="1200" dur="2.8s" begin="0.3s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.15 0.8 0.2 1"/>
      </rect>
    </clipPath>
  </defs>
  <style>
    .mono{font-family:'JetBrains Mono','Fira Code',ui-monospace,Menlo,Consolas,monospace;font-weight:700;}
    @media (prefers-reduced-motion:reduce){animate{display:none}}
  </style>

  <rect width="1200" height="160" fill="url(#qbg)"/>

  <!-- quote marks -->
  <text x="60" y="60" class="mono" font-size="60" fill="#1A2332" opacity="0.8">"</text>
  <text x="1120" y="130" class="mono" font-size="60" fill="#1A2332" opacity="0.8" text-anchor="end">"</text>

  <!-- the quote, typewriter reveal -->
  <g clip-path="url(#qtype)">
    <text x="600" y="95" class="mono" font-size="30" fill="url(#txtGrad)" text-anchor="middle" letter-spacing="2">
      a model that compiles is not a model that ships.
    </text>
  </g>

  <!-- blinking cursor at end -->
  <rect x="0" y="78" width="3" height="30" fill="#4FD6FF" opacity="0">
    <animate attributeName="x" values="0;980;980" keyTimes="0;0.96;1" dur="2.8s" begin="0.3s" fill="freeze"/>
    <animate attributeName="opacity" values="0;0;1;1;0;1" keyTimes="0;0.05;0.06;0.5;0.55;1" dur="2.8s" begin="0.3s" fill="freeze"/>
  </rect>
  <rect x="980" y="78" width="3" height="30" fill="#4FD6FF" opacity="0">
    <animate attributeName="opacity" values="0;0;1;0;1" keyTimes="0;0.96;0.97;0.985;1" dur="2.8s" begin="0.3s" fill="freeze"/>
    <animate attributeName="opacity" values="1;0;1" dur="0.7s" begin="3.2s" repeatCount="indefinite"/>
  </rect>

  <!-- underline -->
  <rect x="200" y="112" width="0" height="2" fill="url(#underline)">
    <animate attributeName="width" from="0" to="800" dur="1s" begin="3.1s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.2 0.8 0.2 1"/>
  </rect>

  <text x="600" y="140" class="mono" font-size="11" fill="#4A5668" text-anchor="middle" opacity="0" letter-spacing="3">
    .manifesto
    <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="3.6s" fill="freeze"/>
  </text>
</svg>
