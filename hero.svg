<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" width="1200" height="460" role="img" aria-label="dhruv.ts compiling">
  <defs>
    <linearGradient id="hbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0A0F16"/>
      <stop offset="1" stop-color="#06080C"/>
    </linearGradient>
    <linearGradient id="htitlebar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#141B28"/>
      <stop offset="1" stop-color="#0E131C"/>
    </linearGradient>
    <linearGradient id="hbuild" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4FD6FF"/>
      <stop offset="1" stop-color="#7EE787"/>
    </linearGradient>
    <linearGradient id="hscan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4FD6FF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#4FD6FF" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#4FD6FF" stop-opacity="0"/>
    </linearGradient>
    <filter id="hglow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
    <filter id="hglow2" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <style>
    .mono{font-family:'JetBrains Mono','Fira Code',ui-monospace,Menlo,Consolas,monospace;}
    @media (prefers-reduced-motion:reduce){animate,animateTransform{display:none}}
  </style>

  <rect width="1200" height="460" fill="url(#hbg)"/>

  <!-- window -->
  <rect x="40" y="24" width="1120" height="412" rx="14" fill="#0B1018" stroke="#1A2332" stroke-width="1.5" filter="url(#hglow)"/>

  <!-- title bar -->
  <path d="M40 38a14 14 0 0 1 14-14h1092a14 14 0 0 1 14 14v32H40z" fill="url(#htitlebar)"/>
  <circle cx="64" cy="53" r="6" fill="#FF5F57"/>
  <circle cx="86" cy="53" r="6" fill="#FEBC2E"/>
  <circle cx="108" cy="53" r="6" fill="#28C840"/>
  <text x="600" y="57" class="mono" font-size="13" fill="#5B6675" text-anchor="middle">dhruv.ts · dhruvnarayanbajaj.dev</text>

  <!-- line numbers -->
  <rect x="40" y="70" width="54" height="290" fill="#070A0F"/>
  <g class="mono" font-size="13" fill="#3A4658" text-anchor="end">
    <text x="80" y="104">1</text><text x="80" y="132">2</text><text x="80" y="160">3</text>
    <text x="80" y="188">4</text><text x="80" y="216">5</text><text x="80" y="244">6</text>
    <text x="80" y="272">7</text><text x="80" y="300">8</text><text x="80" y="328">9</text>
  </g>

  <!-- scanning beam -->
  <rect x="94" y="70" width="1066" height="290" fill="url(#hscan)" opacity="0.4">
    <animate attributeName="y" values="70;320;70" dur="8s" repeatCount="indefinite"/>
  </rect>

  <!-- code lines fading in -->
  <g class="mono" font-size="14">
    <text x="110" y="104" opacity="0">
      <tspan fill="#C678DD">const</tspan> <tspan fill="#61AFEF">dhruv</tspan> <tspan fill="#ABB2BF">=</tspan> <tspan fill="#E5C07B">{</tspan>
      <animate attributeName="opacity" values="0;1" dur="0.3s" begin="0.3s" fill="freeze"/>
    </text>
    <text x="110" y="132" opacity="0">
      <tspan fill="#ABB2BF">  </tspan><tspan fill="#61AFEF">role</tspan><tspan fill="#ABB2BF">:</tspan> <tspan fill="#98C379">'full-stack engineer'</tspan><tspan fill="#ABB2BF">,</tspan>
      <animate attributeName="opacity" values="0;1" dur="0.3s" begin="0.6s" fill="freeze"/>
    </text>
    <text x="110" y="160" opacity="0">
      <tspan fill="#ABB2BF">  </tspan><tspan fill="#61AFEF">stack</tspan><tspan fill="#ABB2BF">:</tspan> <tspan fill="#E5C07B">[</tspan><tspan fill="#98C379">'next.ts'</tspan><tspan fill="#ABB2BF">,</tspan> <tspan fill="#98C379">'rust'</tspan><tspan fill="#ABB2BF">,</tspan> <tspan fill="#98C379">'c++'</tspan><tspan fill="#E5C07B">]</tspan><tspan fill="#ABB2BF">,</tspan>
      <animate attributeName="opacity" values="0;1" dur="0.3s" begin="0.9s" fill="freeze"/>
    </text>
    <text x="110" y="188" opacity="0">
      <tspan fill="#ABB2BF">  </tspan><tspan fill="#61AFEF">ml</tspan><tspan fill="#ABB2BF">:</tspan> <tspan fill="#98C379">'xgboost · pytorch · gemini'</tspan><tspan fill="#ABB2BF">,</tspan>
      <animate attributeName="opacity" values="0;1" dur="0.3s" begin="1.2s" fill="freeze"/>
    </text>
    <text x="110" y="216" opacity="0">
      <tspan fill="#ABB2BF">  </tspan><tspan fill="#C678DD">ship</tspan><tspan fill="#ABB2BF">:</tspan> <tspan fill="#61AFEF">()</tspan> <tspan fill="#56B6C2">=&gt;</tspan> <tspan fill="#98C379">'prod, not demo'</tspan><tspan fill="#ABB2BF">,</tspan>
      <animate attributeName="opacity" values="0;1" dur="0.3s" begin="1.5s" fill="freeze"/>
    </text>
    <text x="110" y="244" opacity="0">
      <tspan fill="#ABB2BF">  </tspan><tspan fill="#61AFEF">depth</tspan><tspan fill="#ABB2BF">:</tspan> <tspan fill="#D19A66">'infra to product'</tspan><tspan fill="#ABB2BF">,</tspan>
      <animate attributeName="opacity" values="0;1" dur="0.3s" begin="1.8s" fill="freeze"/>
    </text>
    <text x="110" y="272" opacity="0">
      <tspan fill="#E5C07B">}</tspan> <tspan fill="#7D8590">// hire me if it compiles</tspan>
      <animate attributeName="opacity" values="0;1" dur="0.3s" begin="2.1s" fill="freeze"/>
    </text>
  </g>

  <!-- blinking cursor -->
  <rect x="110" y="284" width="2" height="18" fill="#4FD6FF" filter="url(#hglow)">
    <animate attributeName="opacity" values="1;0;1" dur="0.7s" begin="2.4s" repeatCount="indefinite"/>
  </rect>

  <!-- build terminal -->
  <rect x="40" y="360" width="1120" height="76" fill="#070A0F"/>
  <line x1="40" y1="360" x2="1160" y2="360" stroke="#1A2332"/>
  <g class="mono" font-size="12">
    <!-- spinner -->
    <g transform="translate(64,388)">
      <circle r="7" fill="none" stroke="#1A2332" stroke-width="2"/>
      <circle r="7" fill="none" stroke="#FFB454" stroke-width="2" stroke-linecap="round" stroke-dasharray="44" stroke-dashoffset="44" filter="url(#hglow2)">
        <animate attributeName="stroke-dashoffset" values="44;11;44" keyTimes="0;0.5;1" dur="1s" begin="2.5s" repeatCount="indefinite"/>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1s" begin="2.5s" repeatCount="indefinite"/>
      </circle>
    </g>
    <text x="84" y="392" fill="#7D8590" opacity="0">compiling dhruv.ts...
      <animate attributeName="opacity" values="0;1" dur="0.3s" begin="2.5s" fill="freeze"/>
    </text>
    <text x="84" y="412" fill="#7EE787" opacity="0" filter="url(#hglow2)">✓ built in 4.2s · 0 errors · 0 warnings
      <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.75;1" dur="4s" begin="2.5s" fill="freeze"/>
    </text>
    <text x="1140" y="392" fill="#5B6675" text-anchor="end" opacity="0">typescript · strict
      <animate attributeName="opacity" values="0;1" dur="0.3s" begin="2.5s" fill="freeze"/>
    </text>
  </g>

  <!-- progress bar -->
  <rect x="40" y="432" width="0" height="4" fill="url(#hbuild)" filter="url(#hglow)">
    <animate attributeName="width" from="0" to="1120" dur="3.5s" begin="2.5s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.2 0.8 0.2 1"/>
  </rect>
</svg>
