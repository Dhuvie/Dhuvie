<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="1200" height="440" role="img" aria-label="linker map: shared languages resolved into repositories">
  <defs>
    <linearGradient id="lbg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0B1018"/><stop offset="1" stop-color="#070A0F"/></linearGradient>
    <radialGradient id="hub" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#4FD6FF"/><stop offset="1" stop-color="#4FD6FF" stop-opacity="0"/></radialGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="4"/></filter>
  </defs>
  <style>
    .mono{font-family:'JetBrains Mono','Fira Code',ui-monospace,Menlo,Consolas,monospace;font-weight:700;}
    .lbl{font-family:'JetBrains Mono','Fira Code',ui-monospace,Menlo,Consolas,monospace;}
    @media (prefers-reduced-motion:reduce){animate,animateTransform,animateMotion{display:none}}
  </style>

  <rect width="1200" height="440" fill="url(#lbg)"/>
  <text x="40" y="46" class="mono" font-size="22" fill="#E6EDF3">.dynamic — linker map</text>
  <text x="40" y="68" class="lbl" font-size="12" fill="#7D8590">shared symbols resolved: languages → repositories</text>
  <line x1="40" y1="84" x2="1160" y2="84" stroke="#1E2735"/>

  <g stroke="#1E2735" stroke-width="1" fill="none">
    <line x1="600" y1="240" x2="250" y2="150"/>
    <line x1="600" y1="240" x2="190" y2="240"/>
    <line x1="600" y1="240" x2="250" y2="330"/>
    <line x1="600" y1="240" x2="380" y2="370"/>
    <line x1="600" y1="240" x2="780" y2="140"/>
    <line x1="600" y1="240" x2="970" y2="110"/>
    <line x1="600" y1="240" x2="1030" y2="210"/>
    <line x1="600" y1="240" x2="960" y2="310"/>
    <line x1="600" y1="240" x2="820" y2="370"/>
  </g>

  <g fill="none" stroke-width="2" stroke-linecap="round">

    <path d="M250 150 Q 600 90 970 110" stroke="#4FD6FF" stroke-dasharray="6 10"><animate attributeName="stroke-dashoffset" from="0" to="-160" dur="2s" repeatCount="indefinite"/></path>
    <path d="M250 150 Q 600 220 960 310" stroke="#4FD6FF" stroke-dasharray="6 10"><animate attributeName="stroke-dashoffset" from="0" to="-160" dur="2.4s" repeatCount="indefinite"/></path>

    <path d="M250 330 Q 600 280 1030 210" stroke="#7EE787" stroke-dasharray="6 10"><animate attributeName="stroke-dashoffset" from="0" to="-160" dur="2.2s" repeatCount="indefinite"/></path>

    <path d="M380 370 Q 600 400 820 370" stroke="#FFB454" stroke-dasharray="6 10"><animate attributeName="stroke-dashoffset" from="0" to="-160" dur="2.6s" repeatCount="indefinite"/></path>

    <path d="M190 240 Q 480 200 780 140" stroke="#FF7B72" stroke-dasharray="6 10"><animate attributeName="stroke-dashoffset" from="0" to="160" dur="2.8s" repeatCount="indefinite"/></path>
  </g>

  <circle r="4" fill="#4FD6FF"><animateMotion dur="3s" repeatCount="indefinite" path="M600 240 Q 780 180 970 110"/></circle>
  <circle r="3" fill="#7EE787"><animateMotion dur="3.4s" repeatCount="indefinite" path="M600 240 Q 800 260 1030 210"/></circle>

  <circle cx="600" cy="240" r="42" fill="url(#hub)" filter="url(#soft)"/>
  <circle cx="600" cy="240" r="26" fill="#0B1018" stroke="#4FD6FF" stroke-width="2"/>
  <circle cx="600" cy="240" r="26" fill="none" stroke="#4FD6FF" stroke-width="2" opacity="0.6"><animate attributeName="r" values="26;42;26" dur="2.4s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.6;0;0.6" dur="2.4s" repeatCount="indefinite"/></circle>
  <text x="600" y="245" class="mono" font-size="15" fill="#E6EDF3" text-anchor="middle">dhruv</text>

  <g class="lbl" font-size="12" fill="#E6EDF3" text-anchor="middle">
    <g><circle cx="250" cy="150" r="22" fill="#0E1A2A" stroke="#4FD6FF" stroke-width="1.5"/><circle cx="250" cy="150" r="22" fill="none" stroke="#4FD6FF" opacity="0.4"><animate attributeName="r" values="22;28;22" dur="2.2s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.4;0;0.4" dur="2.2s" repeatCount="indefinite"/></circle><text x="250" y="154">TS</text></g>
    <g><circle cx="190" cy="240" r="22" fill="#2A1110" stroke="#FF7B72" stroke-width="1.5"/><text x="190" y="244" fill="#FF7B72">Rust</text></g>
    <g><circle cx="250" cy="330" r="22" fill="#0E2A1A" stroke="#7EE787" stroke-width="1.5"/><text x="250" y="334" fill="#7EE787">C++</text></g>
    <g><circle cx="380" cy="370" r="22" fill="#2A1E0E" stroke="#FFB454" stroke-width="1.5"/><text x="380" y="374" fill="#FFB454">Py</text></g>
  </g>

  <g class="lbl" font-size="11" fill="#E6EDF3" text-anchor="middle">
    <g><rect x="910" y="92" width="120" height="36" rx="8" fill="#0E2A1A" stroke="#1F6F33"/><text x="970" y="114">agrivision-ai</text></g>
    <g><rect x="970" y="192" width="120" height="36" rx="8" fill="#0E2A1A" stroke="#1F6F33"/><text x="1030" y="214">Pac-man</text></g>
    <g><rect x="900" y="292" width="120" height="36" rx="8" fill="#0E1A2A" stroke="#1F4F6F"/><text x="960" y="314">DashCode</text></g>
    <g><rect x="760" y="352" width="120" height="36" rx="8" fill="#2A0E1A" stroke="#6F1F3F"/><text x="820" y="374">UPI-ML</text></g>
    <g><rect x="720" y="122" width="120" height="36" rx="8" fill="#0E2A1A" stroke="#1F6F33"/><text x="780" y="144">UniSlot</text></g>
  </g>

  <text x="1160" y="424" class="lbl" font-size="11" fill="#4A5668" text-anchor="end">ld — resolved 9 nodes · 5 dynamic links</text>
</svg>
