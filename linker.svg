<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" role="img" aria-label="dependency transit map">
  <defs>
    <linearGradient id="tmbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#080C12"/>
      <stop offset="1" stop-color="#040608"/>
    </linearGradient>
    <filter id="tmglow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <!-- transit line paths for train animation -->
    <path id="lineTS" d="M 100,180 L 300,180 L 360,240 L 540,240 L 600,280" fill="none"/>
    <path id="linePy" d="M 100,380 L 300,380 L 360,320 L 540,320 L 600,280" fill="none"/>
    <path id="lineCpp" d="M 600,280 L 660,240 L 840,240 L 900,180 L 1100,180" fill="none"/>
    <path id="lineRust" d="M 600,280 L 660,320 L 840,320 L 900,380 L 1100,380" fill="none"/>
    <path id="lineJS" d="M 600,280 L 600,120 L 900,120 L 1000,120" fill="none"/>
  </defs>
  <style>
    .mono{font-family:'JetBrains Mono','Fira Code',ui-monospace,Menlo,Consolas,monospace;font-weight:700;}
    .lbl{font-family:'JetBrains Mono','Fira Code',ui-monospace,Menlo,Consolas,monospace;}
    .stn{font-family:'JetBrains Mono','Fira Code',ui-monospace,Menlo,Consolas,monospace;font-weight:700;}
    @media (prefers-reduced-motion:reduce){animate,animateMotion{display:none}}
  </style>

  <rect width="1200" height="560" fill="url(#tmbg)"/>

  <!-- header -->
  <text x="40" y="44" class="mono" font-size="22" fill="#E6EDF3">.dynamic</text>
  <text x="40" y="66" class="lbl" font-size="12" fill="#5B6675">dependency transit map · 5 lines · 18 stations · trains running</text>
  <text x="1160" y="44" class="lbl" font-size="12" fill="#4A5668" text-anchor="end">ld --transit</text>
  <line x1="40" y1="80" x2="1160" y2="80" stroke="#141C28"/>

  <!-- TRANSIT LINES (drawn as thick colored paths with 45-degree bends) -->
  <!-- TS Line (cyan) -->
  <path d="M 100,180 L 300,180 L 360,240 L 540,240 L 600,280" fill="none" stroke="#4FD6FF" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>
  <!-- Python Line (amber) -->
  <path d="M 100,380 L 300,380 L 360,320 L 540,320 L 600,280" fill="none" stroke="#FFB454" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>
  <!-- C++ Line (green) -->
  <path d="M 600,280 L 660,240 L 840,240 L 900,180 L 1100,180" fill="none" stroke="#7EE787" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>
  <!-- Rust Line (red) -->
  <path d="M 600,280 L 660,320 L 840,320 L 900,380 L 1100,380" fill="none" stroke="#FF7B72" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>
  <!-- JS Line (purple) -->
  <path d="M 600,280 L 600,120 L 900,120 L 1000,120" fill="none" stroke="#B084EB" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>

  <!-- TRAINS (animated dots traveling along each line) -->
  <g filter="url(#tmglow)">
    <circle r="6" fill="#FFFFFF"><animateMotion dur="5s" repeatCount="indefinite"><mpath href="#lineTS"/></animateMotion></circle>
    <circle r="6" fill="#FFFFFF"><animateMotion dur="5.5s" begin="1s" repeatCount="indefinite"><mpath href="#linePy"/></animateMotion></circle>
    <circle r="6" fill="#FFFFFF"><animateMotion dur="4.5s" begin="0.5s" repeatCount="indefinite"><mpath href="#lineCpp"/></animateMotion></circle>
    <circle r="6" fill="#FFFFFF"><animateMotion dur="5s" begin="1.5s" repeatCount="indefinite"><mpath href="#lineRust"/></animateMotion></circle>
    <circle r="6" fill="#FFFFFF"><animateMotion dur="4s" begin="2s" repeatCount="indefinite"><mpath href="#lineJS"/></animateMotion></circle>
  </g>

  <!-- CENTRAL HUB: dhruv (grand central station, all lines interchange) -->
  <g transform="translate(600,280)">
    <circle r="28" fill="#0B1018" stroke="#E6EDF3" stroke-width="3" filter="url(#tmglow)"/>
    <circle r="20" fill="#0B1018" stroke="#E6EDF3" stroke-width="1.5"/>
    <text y="4" class="mono" font-size="9" fill="#E6EDF3" text-anchor="middle">dhruv</text>
    <text y="-36" class="lbl" font-size="8" fill="#5B6675" text-anchor="middle" letter-spacing="2">CENTRAL</text>
  </g>

  <!-- STATIONS: TS Line (cyan) -->
  <!-- station = white circle with colored ring, label offset -->
  <g>
    <!-- TS station -->
    <circle cx="100" cy="180" r="10" fill="#0B1018" stroke="#4FD6FF" stroke-width="3"/>
    <circle cx="100" cy="180" r="4" fill="#4FD6FF"/>
    <text x="100" y="158" class="stn" font-size="13" fill="#4FD6FF" text-anchor="middle">TS</text>
    <!-- Next.js station -->
    <circle cx="200" cy="180" r="10" fill="#0B1018" stroke="#4FD6FF" stroke-width="3"/>
    <circle cx="200" cy="180" r="4" fill="#4FD6FF"/>
    <text x="200" y="158" class="stn" font-size="13" fill="#4FD6FF" text-anchor="middle">Next.js</text>
    <!-- React station -->
    <circle cx="300" cy="180" r="10" fill="#0B1018" stroke="#4FD6FF" stroke-width="3"/>
    <circle cx="300" cy="180" r="4" fill="#4FD6FF"/>
    <text x="300" y="158" class="stn" font-size="13" fill="#4FD6FF" text-anchor="middle">React</text>
    <!-- Vercel station (interchange with TS line end) -->
    <circle cx="480" cy="240" r="10" fill="#0B1018" stroke="#4FD6FF" stroke-width="3"/>
    <circle cx="480" cy="240" r="4" fill="#4FD6FF"/>
    <text x="480" y="224" class="stn" font-size="12" fill="#4FD6FF" text-anchor="middle">Vercel</text>
  </g>

  <!-- STATIONS: Python Line (amber) -->
  <g>
    <!-- Python station -->
    <circle cx="100" cy="380" r="10" fill="#0B1018" stroke="#FFB454" stroke-width="3"/>
    <circle cx="100" cy="380" r="4" fill="#FFB454"/>
    <text x="100" y="408" class="stn" font-size="13" fill="#FFB454" text-anchor="middle">Python</text>
    <!-- PyTorch station -->
    <circle cx="200" cy="380" r="10" fill="#0B1018" stroke="#FFB454" stroke-width="3"/>
    <circle cx="200" cy="380" r="4" fill="#FFB454"/>
    <text x="200" y="408" class="stn" font-size="13" fill="#FFB454" text-anchor="middle">PyTorch</text>
    <!-- Flask station -->
    <circle cx="300" cy="380" r="10" fill="#0B1018" stroke="#FFB454" stroke-width="3"/>
    <circle cx="300" cy="380" r="4" fill="#FFB454"/>
    <text x="300" y="408" class="stn" font-size="13" fill="#FFB454" text-anchor="middle">Flask</text>
    <!-- UPI-ML station (repo, end of Python line) -->
    <rect x="440" y="310" width="100" height="20" rx="10" fill="#0B1018" stroke="#FFB454" stroke-width="2"/>
    <text x="490" y="324" class="stn" font-size="11" fill="#FFB454" text-anchor="middle">UPI-ML</text>
  </g>

  <!-- STATIONS: C++ Line (green) -->
  <g>
    <!-- C++ station -->
    <circle cx="720" cy="240" r="10" fill="#0B1018" stroke="#7EE787" stroke-width="3"/>
    <circle cx="720" cy="240" r="4" fill="#7EE787"/>
    <text x="720" y="224" class="stn" font-size="13" fill="#7EE787" text-anchor="middle">C++</text>
    <!-- OpenGL station -->
    <circle cx="840" cy="240" r="10" fill="#0B1018" stroke="#7EE787" stroke-width="3"/>
    <circle cx="840" cy="240" r="4" fill="#7EE787"/>
    <text x="840" y="224" class="stn" font-size="13" fill="#7EE787" text-anchor="middle">OpenGL</text>
    <!-- C station -->
    <circle cx="900" cy="180" r="10" fill="#0B1018" stroke="#7EE787" stroke-width="3"/>
    <circle cx="900" cy="180" r="4" fill="#7EE787"/>
    <text x="900" y="158" class="stn" font-size="13" fill="#7EE787" text-anchor="middle">C</text>
    <!-- Pac-man station (repo, end of C++ line) -->
    <rect x="1050" y="170" width="100" height="20" rx="10" fill="#0B1018" stroke="#7EE787" stroke-width="2"/>
    <text x="1100" y="184" class="stn" font-size="11" fill="#7EE787" text-anchor="middle">Pac-man</text>
  </g>

  <!-- STATIONS: Rust Line (red) -->
  <g>
    <!-- Rust station -->
    <circle cx="720" cy="320" r="10" fill="#0B1018" stroke="#FF7B72" stroke-width="3"/>
    <circle cx="720" cy="320" r="4" fill="#FF7B72"/>
    <text x="720" y="346" class="stn" font-size="13" fill="#FF7B72" text-anchor="middle">Rust</text>
    <!-- WASM station -->
    <circle cx="840" cy="320" r="10" fill="#0B1018" stroke="#FF7B72" stroke-width="3"/>
    <circle cx="840" cy="320" r="4" fill="#FF7B72"/>
    <text x="840" y="346" class="stn" font-size="13" fill="#FF7B72" text-anchor="middle">WASM</text>
    <!-- Linux station -->
    <circle cx="900" cy="380" r="10" fill="#0B1018" stroke="#FF7B72" stroke-width="3"/>
    <circle cx="900" cy="380" r="4" fill="#FF7B72"/>
    <text x="900" y="408" class="stn" font-size="13" fill="#FF7B72" text-anchor="middle">Linux</text>
    <!-- Git station -->
    <circle cx="1000" cy="380" r="10" fill="#0B1018" stroke="#FF7B72" stroke-width="3"/>
    <circle cx="1000" cy="380" r="4" fill="#FF7B72"/>
    <text x="1000" y="408" class="stn" font-size="13" fill="#FF7B72" text-anchor="middle">Git</text>
    <!-- agrivision-ai station (repo, end of Rust line) -->
    <rect x="1050" y="370" width="120" height="20" rx="10" fill="#0B1018" stroke="#FF7B72" stroke-width="2"/>
    <text x="1110" y="384" class="stn" font-size="11" fill="#FF7B72" text-anchor="middle">agrivision-ai</text>
  </g>

  <!-- STATIONS: JS Line (purple) -->
  <g>
    <!-- JS station -->
    <circle cx="600" cy="200" r="10" fill="#0B1018" stroke="#B084EB" stroke-width="3"/>
    <circle cx="600" cy="200" r="4" fill="#B084EB"/>
    <text x="584" y="204" class="stn" font-size="13" fill="#B084EB" text-anchor="end">JS</text>
    <!-- Node.js station -->
    <circle cx="720" cy="120" r="10" fill="#0B1018" stroke="#B084EB" stroke-width="3"/>
    <circle cx="720" cy="120" r="4" fill="#B084EB"/>
    <text x="720" y="104" class="stn" font-size="13" fill="#B084EB" text-anchor="middle">Node.js</text>
    <!-- Docker station -->
    <circle cx="840" cy="120" r="10" fill="#0B1018" stroke="#B084EB" stroke-width="3"/>
    <circle cx="840" cy="120" r="4" fill="#B084EB"/>
    <text x="840" y="104" class="stn" font-size="13" fill="#B084EB" text-anchor="middle">Docker</text>
    <!-- DashCode station (repo, end of JS line) -->
    <rect x="950" y="110" width="100" height="20" rx="10" fill="#0B1018" stroke="#B084EB" stroke-width="2"/>
    <text x="1000" y="124" class="stn" font-size="11" fill="#B084EB" text-anchor="middle">DashCode</text>
  </g>

  <!-- UniSlot (spur from JS line) -->
  <path d="M 900,120 L 900,80 L 1050,80" fill="none" stroke="#B084EB" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" opacity="0.5" stroke-dasharray="8 4"/>
  <rect x="1050" y="70" width="100" height="20" rx="10" fill="#0B1018" stroke="#B084EB" stroke-width="2"/>
  <text x="1100" y="84" class="stn" font-size="11" fill="#B084EB" text-anchor="middle">UniSlot</text>

  <!-- LEGEND -->
  <g transform="translate(40,460)">
    <text x="0" y="0" class="lbl" font-size="11" fill="#5B6675" letter-spacing="2">LEGEND</text>
    <line x1="0" y1="8" x2="200" y2="8" stroke="#141C28"/>

    <g transform="translate(0,28)">
      <line x1="0" y1="0" x2="30" y2="0" stroke="#4FD6FF" stroke-width="5" stroke-linecap="round"/>
      <text x="40" y="4" class="lbl" font-size="11" fill="#4FD6FF">TS Line</text>
    </g>
    <g transform="translate(120,28)">
      <line x1="0" y1="0" x2="30" y2="0" stroke="#FFB454" stroke-width="5" stroke-linecap="round"/>
      <text x="40" y="4" class="lbl" font-size="11" fill="#FFB454">Py Line</text>
    </g>
    <g transform="translate(240,28)">
      <line x1="0" y1="0" x2="30" y2="0" stroke="#7EE787" stroke-width="5" stroke-linecap="round"/>
      <text x="40" y="4" class="lbl" font-size="11" fill="#7EE787">C++ Line</text>
    </g>
    <g transform="translate(370,28)">
      <line x1="0" y1="0" x2="30" y2="0" stroke="#FF7B72" stroke-width="5" stroke-linecap="round"/>
      <text x="40" y="4" class="lbl" font-size="11" fill="#FF7B72">Rust Line</text>
    </g>
    <g transform="translate(500,28)">
      <line x1="0" y1="0" x2="30" y2="0" stroke="#B084EB" stroke-width="5" stroke-linecap="round"/>
      <text x="40" y="4" class="lbl" font-size="11" fill="#B084EB">JS Line</text>
    </g>

    <g transform="translate(0,56)">
      <circle r="6" fill="#0B1018" stroke="#E6EDF3" stroke-width="2"/>
      <text x="14" y="4" class="lbl" font-size="10" fill="#5B6675">station (tech)</text>
    </g>
    <g transform="translate(140,56)">
      <rect x="-8" y="-6" width="16" height="12" rx="6" fill="#0B1018" stroke="#E6EDF3" stroke-width="1.5"/>
      <text x="14" y="4" class="lbl" font-size="10" fill="#5B6675">terminus (repo)</text>
    </g>
    <g transform="translate(300,56)">
      <circle r="4" fill="#FFFFFF"/>
      <text x="14" y="4" class="lbl" font-size="10" fill="#5B6675">train (in transit)</text>
    </g>
    <g transform="translate(440,56)">
      <circle r="8" fill="#0B1018" stroke="#E6EDF3" stroke-width="3"/>
      <text x="16" y="4" class="lbl" font-size="10" fill="#5B6675">central hub (dhruv)</text>
    </g>
  </g>

  <!-- route info (right side) -->
  <g transform="translate(960,460)">
    <text x="0" y="0" class="lbl" font-size="11" fill="#5B6675" letter-spacing="2">ROUTES</text>
    <line x1="0" y1="8" x2="200" y2="8" stroke="#141C28"/>
    <text x="0" y="28" class="lbl" font-size="10" fill="#4FD6FF">TS → Vercel</text>
    <text x="0" y="44" class="lbl" font-size="10" fill="#FFB454">Py → UPI-ML</text>
    <text x="0" y="60" class="lbl" font-size="10" fill="#7EE787">C++ → Pac-man</text>
    <text x="0" y="76" class="lbl" font-size="10" fill="#FF7B72">Rust → agrivision</text>
    <text x="0" y="92" class="lbl" font-size="10" fill="#B084EB">JS → DashCode</text>
  </g>

  <text x="40" y="540" class="lbl" font-size="10" fill="#4A5668">all lines operational · 0 delays · 18 stations served</text>
  <text x="1160" y="540" class="lbl" font-size="10" fill="#4A5668" text-anchor="end">transit map v2.0</text>
</svg>
