<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" role="img" aria-label="featured repositories">
  <defs>
    <linearGradient id="pbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0A0F16"/>
      <stop offset="1" stop-color="#06080C"/>
    </linearGradient>
    <linearGradient id="pbeam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4FD6FF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#4FD6FF" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#4FD6FF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="psp1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4FD6FF"/>
      <stop offset="1" stop-color="#7EE787"/>
    </linearGradient>
    <linearGradient id="psp2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFB454"/>
      <stop offset="1" stop-color="#FF7B9C"/>
    </linearGradient>
    <linearGradient id="pcard" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0E131C"/>
      <stop offset="1" stop-color="#0A0E14"/>
    </linearGradient>
    <filter id="pglow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
    <filter id="pglow2" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <style>
    .mono{font-family:'JetBrains Mono','Fira Code',ui-monospace,Menlo,Consolas,monospace;}
    .name{font-family:'JetBrains Mono','Fira Code',ui-monospace,Menlo,Consolas,monospace;font-weight:700;}
    @media (prefers-reduced-motion:reduce){animate,animateTransform{display:none}}
  </style>

  <rect width="1200" height="600" fill="url(#pbg)"/>

  <text x="40" y="44" class="name" font-size="22" fill="#E6EDF3">.dynsym</text>
  <text x="40" y="66" class="mono" font-size="12" fill="#5B6675">featured repositories · github.com/Dhuvie</text>
  <line x1="40" y1="82" x2="1160" y2="82" stroke="#101820"/>

  <!-- scanning beam -->
  <rect x="40" y="90" width="1120" height="480" fill="url(#pbeam)" opacity="0.3">
    <animate attributeName="y" values="90;500;90" dur="9s" repeatCount="indefinite"/>
  </rect>

  <!-- ROW 1 -->
  <g transform="translate(0,120)" opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.4s" begin="0.2s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" values="-20,120;0,120" dur="0.4s" begin="0.2s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.2 0.8 0.2 1"/>
    <rect x="40" y="0" width="1120" height="80" rx="10" fill="url(#pcard)" stroke="#1A2332" stroke-width="1" filter="url(#pglow)"/>
    <rect x="40" y="0" width="4" height="80" rx="2" fill="#7EE787" filter="url(#pglow2)"/>
    <text x="64" y="28" class="name" font-size="18" fill="#E6EDF3">agrivision-ai</text>
    <text x="64" y="50" class="mono" font-size="12" fill="#5B6675">AI-powered agricultural intelligence for Indian farmers</text>
    <rect x="64" y="58" width="170" height="14" rx="7" fill="#0E2A1A" stroke="#1F6F33" stroke-width="0.5"/>
    <text x="74" y="68" class="mono" font-size="9" fill="#7EE787">Next.js · Gemini · TS</text>
    <polyline points="950,50 980,42 1010,48 1040,36 1070,44 1100,30 1130,38" fill="none" stroke="url(#psp1)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="220" stroke-dashoffset="220" filter="url(#pglow)">
      <animate attributeName="stroke-dashoffset" from="220" to="0" dur="1s" begin="0.6s" fill="freeze"/>
    </polyline>
    <text x="1130" y="68" class="mono" font-size="10" fill="#FFB454" text-anchor="end">★ flagship</text>
  </g>

  <!-- ROW 2 -->
  <g transform="translate(0,215)" opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.4s" begin="0.45s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" values="-20,215;0,215" dur="0.4s" begin="0.45s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.2 0.8 0.2 1"/>
    <rect x="40" y="0" width="1120" height="80" rx="10" fill="url(#pcard)" stroke="#1A2332" stroke-width="1" filter="url(#pglow)"/>
    <rect x="40" y="0" width="4" height="80" rx="2" fill="#FF7B9C" filter="url(#pglow2)"/>
    <text x="64" y="28" class="name" font-size="18" fill="#E6EDF3">UPI-ML-Fraud-Detection</text>
    <text x="64" y="50" class="mono" font-size="12" fill="#5B6675">real-time fraud detection · 87% F1 · cost-asymmetric pipeline</text>
    <rect x="64" y="58" width="180" height="14" rx="7" fill="#2A0E1A" stroke="#6F1F3F" stroke-width="0.5"/>
    <text x="74" y="68" class="mono" font-size="9" fill="#FF7B9C">Python · XGBoost · Flask</text>
    <polyline points="950,54 980,48 1010,38 1040,44 1070,32 1100,36 1130,24" fill="none" stroke="url(#psp2)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="220" stroke-dashoffset="220" filter="url(#pglow)">
      <animate attributeName="stroke-dashoffset" from="220" to="0" dur="1s" begin="0.85s" fill="freeze"/>
    </polyline>
    <text x="1130" y="68" class="mono" font-size="10" fill="#7EE787" text-anchor="end">.87 F1</text>
  </g>

  <!-- ROW 3 -->
  <g transform="translate(0,310)" opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.4s" begin="0.7s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" values="-20,310;0,310" dur="0.4s" begin="0.7s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.2 0.8 0.2 1"/>
    <rect x="40" y="0" width="1120" height="80" rx="10" fill="url(#pcard)" stroke="#1A2332" stroke-width="1" filter="url(#pglow)"/>
    <rect x="40" y="0" width="4" height="80" rx="2" fill="#FFB454" filter="url(#pglow2)"/>
    <text x="64" y="28" class="name" font-size="18" fill="#E6EDF3">Pac-man</text>
    <text x="64" y="50" class="mono" font-size="12" fill="#5B6675">C++17 · A*/Dijkstra ghost AI · OpenGL · 4 ghost personalities</text>
    <rect x="64" y="58" width="170" height="14" rx="7" fill="#2A1A0E" stroke="#6F4F1F" stroke-width="0.5"/>
    <text x="74" y="68" class="mono" font-size="9" fill="#FFB454">C++17 · OpenGL · CMake</text>
    <polyline points="950,48 980,52 1010,40 1040,46 1070,34 1100,42 1130,30" fill="none" stroke="url(#psp1)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="220" stroke-dashoffset="220" filter="url(#pglow)">
      <animate attributeName="stroke-dashoffset" from="220" to="0" dur="1s" begin="1.1s" fill="freeze"/>
    </polyline>
    <text x="1130" y="68" class="mono" font-size="10" fill="#FFB454" text-anchor="end">★ systems</text>
  </g>

  <!-- ROW 4 -->
  <g transform="translate(0,405)" opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.4s" begin="0.95s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" values="-20,405;0,405" dur="0.4s" begin="0.95s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.2 0.8 0.2 1"/>
    <rect x="40" y="0" width="1120" height="80" rx="10" fill="url(#pcard)" stroke="#1A2332" stroke-width="1" filter="url(#pglow)"/>
    <rect x="40" y="0" width="4" height="80" rx="2" fill="#4FD6FF" filter="url(#pglow2)"/>
    <text x="64" y="28" class="name" font-size="18" fill="#E6EDF3">AutoForge</text>
    <text x="64" y="50" class="mono" font-size="12" fill="#5B6675">AutoML + MLOps platform · auto EDA · pipeline generation</text>
    <rect x="64" y="58" width="140" height="14" rx="7" fill="#0E1A2A" stroke="#1F4F6F" stroke-width="0.5"/>
    <text x="74" y="68" class="mono" font-size="9" fill="#4FD6FF">Next.js 16 · TS</text>
    <polyline points="950,50 980,44 1010,52 1040,38 1070,46 1100,32 1130,40" fill="none" stroke="url(#psp2)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="220" stroke-dashoffset="220" filter="url(#pglow)">
      <animate attributeName="stroke-dashoffset" from="220" to="0" dur="1s" begin="1.35s" fill="freeze"/>
    </polyline>
    <text x="1130" y="68" class="mono" font-size="10" fill="#4FD6FF" text-anchor="end">★ ml</text>
  </g>

  <!-- ROW 5 -->
  <g transform="translate(0,500)" opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.4s" begin="1.2s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" values="-20,500;0,500" dur="0.4s" begin="1.2s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.2 0.8 0.2 1"/>
    <rect x="40" y="0" width="1120" height="80" rx="10" fill="url(#pcard)" stroke="#1A2332" stroke-width="1" filter="url(#pglow)"/>
    <rect x="40" y="0" width="4" height="80" rx="2" fill="#7EE787" filter="url(#pglow2)"/>
    <text x="64" y="28" class="name" font-size="18" fill="#E6EDF3">DashCode</text>
    <text x="64" y="50" class="mono" font-size="12" fill="#5B6675">competitive programming analytics · 4 platforms unified</text>
    <rect x="64" y="58" width="170" height="14" rx="7" fill="#0E1A2A" stroke="#1F4F6F" stroke-width="0.5"/>
    <text x="74" y="68" class="mono" font-size="9" fill="#4FD6FF">Next.js · TS · Postgres</text>
    <polyline points="950,46 980,50 1010,42 1040,48 1070,36 1100,44 1130,32" fill="none" stroke="url(#psp1)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="220" stroke-dashoffset="220" filter="url(#pglow)">
      <animate attributeName="stroke-dashoffset" from="220" to="0" dur="1s" begin="1.6s" fill="freeze"/>
    </polyline>
    <text x="1130" y="68" class="mono" font-size="10" fill="#FFB454" text-anchor="end">★ fullstack</text>
  </g>
</svg>
