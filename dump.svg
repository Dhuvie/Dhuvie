<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-label="live language and commit activity">
  <defs>
    <linearGradient id="dbg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0B1018"/><stop offset="1" stop-color="#070A0F"/></linearGradient>
    <linearGradient id="b1" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#4FD6FF"/><stop offset="1" stop-color="#79C0FF"/></linearGradient>
    <linearGradient id="b2" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FF7B72"/><stop offset="1" stop-color="#FFB454"/></linearGradient>
    <linearGradient id="b3" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7EE787"/><stop offset="1" stop-color="#56D364"/></linearGradient>
    <linearGradient id="b4" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FFB454"/><stop offset="1" stop-color="#FF7B9C"/></linearGradient>
    <linearGradient id="b5" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#C678DD"/><stop offset="1" stop-color="#FF7B9C"/></linearGradient>
  </defs>
  <style>
    .mono{font-family:'JetBrains Mono','Fira Code',ui-monospace,Menlo,Consolas,monospace;}
    .name{font-family:'JetBrains Mono','Fira Code',ui-monospace,Menlo,Consolas,monospace;font-weight:700;}
    @media (prefers-reduced-motion:reduce){animate,animateTransform,animateMotion{display:none}}
  </style>

  <rect width="1200" height="420" fill="url(#dbg)"/>
  <text x="40" y="46" class="name" font-size="22" fill="#E6EDF3">/proc — live language map</text>
  <text x="40" y="68" class="mono" font-size="12" fill="#7D8590">heap composition · refreshed daily by CI</text>
  <line x1="40" y1="84" x2="1160" y2="84" stroke="#1E2735"/>

  <g class="mono" font-size="14">

    <text x="60" y="128" fill="#E6EDF3" font-weight="700">TypeScript</text>
    <rect x="240" y="114" width="800" height="20" rx="10" fill="#11161F" stroke="#1E2735"/>
    <rect x="240" y="114" width="0" height="20" rx="10" fill="url(#b1)"><animate attributeName="width" from="0" to="336" dur="1.1s" begin="0.2s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.2 0.8 0.2 1"/></rect>
    <rect x="240" y="114" width="40" height="20" rx="10" fill="#fff" opacity="0.25"><animate attributeName="x" from="240" to="576" dur="2.4s" begin="1.3s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.25;0" dur="2.4s" begin="1.3s" repeatCount="indefinite"/></rect>
    <text x="1060" y="128" fill="#4FD6FF" font-weight="700">42%</text>

    <text x="60" y="178" fill="#E6EDF3" font-weight="700">Rust</text>
    <rect x="240" y="164" width="800" height="20" rx="10" fill="#11161F" stroke="#1E2735"/>
    <rect x="240" y="164" width="0" height="20" rx="10" fill="url(#b2)"><animate attributeName="width" from="0" to="168" dur="1.0s" begin="0.45s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.2 0.8 0.2 1"/></rect>
    <text x="1060" y="178" fill="#FF7B72" font-weight="700">21%</text>

    <text x="60" y="228" fill="#E6EDF3" font-weight="700">C++</text>
    <rect x="240" y="214" width="800" height="20" rx="10" fill="#11161F" stroke="#1E2735"/>
    <rect x="240" y="214" width="0" height="20" rx="10" fill="url(#b3)"><animate attributeName="width" from="0" to="112" dur="0.9s" begin="0.65s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.2 0.8 0.2 1"/></rect>
    <text x="1060" y="228" fill="#7EE787" font-weight="700">14%</text>

    <text x="60" y="278" fill="#E6EDF3" font-weight="700">Python</text>
    <rect x="240" y="264" width="800" height="20" rx="10" fill="#11161F" stroke="#1E2735"/>
    <rect x="240" y="264" width="0" height="20" rx="10" fill="url(#b4)"><animate attributeName="width" from="0" to="104" dur="0.9s" begin="0.85s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.2 0.8 0.2 1"/></rect>
    <text x="1060" y="278" fill="#FFB454" font-weight="700">13%</text>

    <text x="60" y="328" fill="#E6EDF3" font-weight="700">JavaScript</text>
    <rect x="240" y="314" width="800" height="20" rx="10" fill="#11161F" stroke="#1E2735"/>
    <rect x="240" y="314" width="0" height="20" rx="10" fill="url(#b5)"><animate attributeName="width" from="0" to="80" dur="0.8s" begin="1.05s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.2 0.8 0.2 1"/></rect>
    <text x="1060" y="328" fill="#C678DD" font-weight="700">10%</text>
  </g>

  <g class="mono" font-size="11" fill="#3A4658">
    <text x="40" y="372">0x7f00</text>
    <text x="110" y="372">7f 45 4c 46 02 01 01 00 00 00 00 00 00 00 00 00</text>
    <text x="110" y="392">00 00 03 00 3e 00 01 00 00 00 00 d0 00 00 00 00</text>
    <text x="560" y="372" fill="#4FD6FF">.ELF............</text>
    <text x="560" y="392" fill="#4A5668">........&gt;.......}</text>
    <text x="780" y="372" fill="#7D8590">commits/365d:</text>
    <text x="780" y="392" fill="#7EE787">1,284 · ▁▂▄▃▅▇▆▇</text>
  </g>
  <rect x="0" y="360" width="1200" height="0.5" fill="#1E2735"/>
</svg>
