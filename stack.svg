<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" role="img" aria-label="skill constellation">
  <defs>
    <radialGradient id="sCoreGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#4FD6FF" stop-opacity="0.5"/>
      <stop offset="0.4" stop-color="#4FD6FF" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#4FD6FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sCoreInner" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#E6EDF3"/>
      <stop offset="0.5" stop-color="#4FD6FF"/>
      <stop offset="1" stop-color="#1A6F8F"/>
    </radialGradient>
    <linearGradient id="sLangRing" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4FD6FF"/>
      <stop offset="1" stop-color="#7EE787"/>
    </linearGradient>
    <linearGradient id="sFwRing" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFB454"/>
      <stop offset="1" stop-color="#FF7B9C"/>
    </linearGradient>
    <linearGradient id="sInfraRing" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#B084EB"/>
      <stop offset="1" stop-color="#4FD6FF"/>
    </linearGradient>
    <filter id="sGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <filter id="sBigGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <style>
    .mono{font-family:'JetBrains Mono','Fira Code',ui-monospace,Menlo,Consolas,monospace;font-weight:700;}
    .lbl{font-family:'JetBrains Mono','Fira Code',ui-monospace,Menlo,Consolas,monospace;}
    @media (prefers-reduced-motion:reduce){animate,animateTransform,animateMotion{display:none}}
  </style>

  <rect width="1200" height="560" fill="#040608"/>

  <!-- header -->
  <text x="40" y="44" class="mono" font-size="20" fill="#E6EDF3">.symtab</text>
  <text x="40" y="66" class="lbl" font-size="12" fill="#5B6675">18 symbols · 3 orbits · live edges</text>
  <text x="1160" y="44" class="lbl" font-size="12" fill="#4A5668" text-anchor="end">skill constellation</text>
  <line x1="40" y1="80" x2="1160" y2="80" stroke="#101820"/>

  <!-- ambient rings -->
  <g transform="translate(600,310)" opacity="0.06">
    <circle r="120" fill="none" stroke="#1A2332" stroke-dasharray="2 6"/>
    <circle r="200" fill="none" stroke="#1A2332" stroke-dasharray="2 6"/>
    <circle r="270" fill="none" stroke="#1A2332" stroke-dasharray="2 6"/>
  </g>

  <!-- counter-rotating orbit rings -->
  <g transform="translate(600,310)">
    <g><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="50s" repeatCount="indefinite"/>
      <circle r="120" fill="none" stroke="url(#sLangRing)" stroke-width="0.8" opacity="0.2" stroke-dasharray="4 8"/></g>
    <g><animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="70s" repeatCount="indefinite"/>
      <circle r="200" fill="none" stroke="url(#sFwRing)" stroke-width="0.8" opacity="0.2" stroke-dasharray="4 8"/></g>
    <g><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="90s" repeatCount="indefinite"/>
      <circle r="270" fill="none" stroke="url(#sInfraRing)" stroke-width="0.8" opacity="0.2" stroke-dasharray="4 8"/></g>
  </g>

  <!-- edges core to nodes -->
  <g transform="translate(600,310)" stroke-width="1.2" fill="none">
    <line x1="0" y1="0" x2="120" y2="0" stroke="#4FD6FF" stroke-dasharray="5 7" opacity="0.4"><animate attributeName="stroke-dashoffset" from="0" to="-24" dur="1.8s" repeatCount="indefinite"/></line>
    <line x1="0" y1="0" x2="60" y2="-104" stroke="#4FD6FF" stroke-dasharray="5 7" opacity="0.4"><animate attributeName="stroke-dashoffset" from="0" to="-24" dur="2s" repeatCount="indefinite"/></line>
    <line x1="0" y1="0" x2="-60" y2="-104" stroke="#4FD6FF" stroke-dasharray="5 7" opacity="0.4"><animate attributeName="stroke-dashoffset" from="0" to="-24" dur="2.2s" repeatCount="indefinite"/></line>
    <line x1="0" y1="0" x2="-120" y2="0" stroke="#4FD6FF" stroke-dasharray="5 7" opacity="0.4"><animate attributeName="stroke-dashoffset" from="0" to="-24" dur="1.9s" repeatCount="indefinite"/></line>
    <line x1="0" y1="0" x2="-60" y2="104" stroke="#4FD6FF" stroke-dasharray="5 7" opacity="0.4"><animate attributeName="stroke-dashoffset" from="0" to="-24" dur="2.1s" repeatCount="indefinite"/></line>
    <line x1="0" y1="0" x2="60" y2="104" stroke="#4FD6FF" stroke-dasharray="5 7" opacity="0.4"><animate attributeName="stroke-dashoffset" from="0" to="-24" dur="2.3s" repeatCount="indefinite"/></line>
    <line x1="0" y1="0" x2="200" y2="0" stroke="#FFB454" stroke-dasharray="5 7" opacity="0.35"><animate attributeName="stroke-dashoffset" from="0" to="-24" dur="2.4s" repeatCount="indefinite"/></line>
    <line x1="0" y1="0" x2="100" y2="-173" stroke="#FFB454" stroke-dasharray="5 7" opacity="0.35"><animate attributeName="stroke-dashoffset" from="0" to="-24" dur="2.6s" repeatCount="indefinite"/></line>
    <line x1="0" y1="0" x2="-100" y2="-173" stroke="#FFB454" stroke-dasharray="5 7" opacity="0.35"><animate attributeName="stroke-dashoffset" from="0" to="-24" dur="2.5s" repeatCount="indefinite"/></line>
    <line x1="0" y1="0" x2="-200" y2="0" stroke="#FFB454" stroke-dasharray="5 7" opacity="0.35"><animate attributeName="stroke-dashoffset" from="0" to="-24" dur="2.7s" repeatCount="indefinite"/></line>
    <line x1="0" y1="0" x2="-100" y2="173" stroke="#FFB454" stroke-dasharray="5 7" opacity="0.35"><animate attributeName="stroke-dashoffset" from="0" to="-24" dur="2.3s" repeatCount="indefinite"/></line>
    <line x1="0" y1="0" x2="100" y2="173" stroke="#FFB454" stroke-dasharray="5 7" opacity="0.35"><animate attributeName="stroke-dashoffset" from="0" to="-24" dur="2.2s" repeatCount="indefinite"/></line>
    <line x1="0" y1="0" x2="270" y2="0" stroke="#B084EB" stroke-dasharray="5 7" opacity="0.3"><animate attributeName="stroke-dashoffset" from="0" to="-24" dur="2.8s" repeatCount="indefinite"/></line>
    <line x1="0" y1="0" x2="135" y2="-234" stroke="#B084EB" stroke-dasharray="5 7" opacity="0.3"><animate attributeName="stroke-dashoffset" from="0" to="-24" dur="3s" repeatCount="indefinite"/></line>
    <line x1="0" y1="0" x2="-135" y2="-234" stroke="#B084EB" stroke-dasharray="5 7" opacity="0.3"><animate attributeName="stroke-dashoffset" from="0" to="-24" dur="2.9s" repeatCount="indefinite"/></line>
    <line x1="0" y1="0" x2="-270" y2="0" stroke="#B084EB" stroke-dasharray="5 7" opacity="0.3"><animate attributeName="stroke-dashoffset" from="0" to="-24" dur="3.1s" repeatCount="indefinite"/></line>
    <line x1="0" y1="0" x2="-135" y2="234" stroke="#B084EB" stroke-dasharray="5 7" opacity="0.3"><animate attributeName="stroke-dashoffset" from="0" to="-24" dur="2.7s" repeatCount="indefinite"/></line>
    <line x1="0" y1="0" x2="135" y2="234" stroke="#B084EB" stroke-dasharray="5 7" opacity="0.3"><animate attributeName="stroke-dashoffset" from="0" to="-24" dur="2.6s" repeatCount="indefinite"/></line>
  </g>

  <!-- cross-connections -->
  <g transform="translate(600,310)" stroke-width="1.5" fill="none">
    <path d="M120,0 Q160,-40 200,0" stroke="#4FD6FF" stroke-dasharray="3 5" opacity="0.15"><animate attributeName="opacity" values="0.1;0.5;0.1" dur="3s" repeatCount="indefinite"/></path>
    <path d="M-60,-104 Q-80,-180 -135,-234" stroke="#7EE787" stroke-dasharray="3 5" opacity="0.15"><animate attributeName="opacity" values="0.1;0.5;0.1" dur="3.5s" begin="0.5s" repeatCount="indefinite"/></path>
    <path d="M-120,0 Q-150,80 -200,0" stroke="#FFB454" stroke-dasharray="3 5" opacity="0.15"><animate attributeName="opacity" values="0.1;0.5;0.1" dur="3.2s" begin="1s" repeatCount="indefinite"/></path>
    <path d="M-60,104 Q-80,180 -100,173" stroke="#FF7B9C" stroke-dasharray="3 5" opacity="0.15"><animate attributeName="opacity" values="0.1;0.5;0.1" dur="2.8s" begin="1.5s" repeatCount="indefinite"/></path>
    <path d="M60,104 Q80,180 100,173" stroke="#4FD6FF" stroke-dasharray="3 5" opacity="0.15"><animate attributeName="opacity" values="0.1;0.5;0.1" dur="3.4s" begin="2s" repeatCount="indefinite"/></path>
    <path d="M200,0 Q235,-120 270,0" stroke="#B084EB" stroke-dasharray="3 5" opacity="0.15"><animate attributeName="opacity" values="0.1;0.5;0.1" dur="3.6s" begin="0.3s" repeatCount="indefinite"/></path>
  </g>

  <!-- particle trails -->
  <g transform="translate(600,310)">
    <circle r="3" fill="#4FD6FF" filter="url(#sGlow)"><animateMotion dur="2.2s" repeatCount="indefinite" path="M0,0 L120,0"/></circle>
    <circle r="2.5" fill="#FF7B72" filter="url(#sGlow)"><animateMotion dur="2.5s" begin="0.3s" repeatCount="indefinite" path="M0,0 L60,-104"/></circle>
    <circle r="2.5" fill="#7EE787" filter="url(#sGlow)"><animateMotion dur="2.4s" begin="0.6s" repeatCount="indefinite" path="M0,0 L-60,-104"/></circle>
    <circle r="3" fill="#FFB454" filter="url(#sGlow)"><animateMotion dur="2.6s" begin="0.2s" repeatCount="indefinite" path="M0,0 L-120,0"/></circle>
    <circle r="2.5" fill="#FFB454" filter="url(#sGlow)"><animateMotion dur="2.8s" begin="0.5s" repeatCount="indefinite" path="M0,0 L200,0"/></circle>
    <circle r="2.5" fill="#B084EB" filter="url(#sGlow)"><animateMotion dur="3s" begin="0.8s" repeatCount="indefinite" path="M0,0 L270,0"/></circle>
    <circle r="2.5" fill="#7EE787" filter="url(#sGlow)"><animateMotion dur="2.9s" begin="1s" repeatCount="indefinite" path="M0,0 L-135,-234"/></circle>
    <circle r="2.5" fill="#4FD6FF" filter="url(#sGlow)"><animateMotion dur="2.7s" begin="1.2s" repeatCount="indefinite" path="M0,0 L135,234"/></circle>
  </g>

  <!-- CORE with shockwaves -->
  <g transform="translate(600,310)">
    <circle r="70" fill="url(#sCoreGlow)" filter="url(#sBigGlow)">
      <animate attributeName="opacity" values="0.4;0.8;0.4" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle r="28" fill="none" stroke="#4FD6FF" stroke-width="2" opacity="0" filter="url(#sGlow)">
      <animate attributeName="r" values="28;60;28" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;0;0.8" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle r="28" fill="none" stroke="#7EE787" stroke-width="1.5" opacity="0" filter="url(#sGlow)">
      <animate attributeName="r" values="28;55;28" dur="3s" begin="1.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0;0.6" dur="3s" begin="1.5s" repeatCount="indefinite"/>
    </circle>
    <circle r="26" fill="url(#sCoreInner)" filter="url(#sGlow)">
      <animate attributeName="r" values="26;29;26" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text y="5" class="mono" font-size="13" fill="#040608" text-anchor="middle">dhruv</text>
  </g>

  <!-- LANGUAGE nodes -->
  <g transform="translate(600,310)" class="lbl" font-size="11" fill="#E6EDF3" text-anchor="middle">
    <g transform="translate(120,0)"><circle r="17" fill="#0B1018" stroke="#4FD6FF" stroke-width="2" filter="url(#sGlow)"/><circle r="17" fill="none" stroke="#4FD6FF" opacity="0.3"><animate attributeName="r" values="17;23;17" dur="2.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.4;0;0.4" dur="2.5s" repeatCount="indefinite"/></circle><text y="4">TS</text></g>
    <g transform="translate(60,-104)"><circle r="17" fill="#0B1018" stroke="#FF7B72" stroke-width="2" filter="url(#sGlow)"/><circle r="17" fill="none" stroke="#FF7B72" opacity="0.3"><animate attributeName="r" values="17;23;17" dur="2.8s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.4;0;0.4" dur="2.8s" repeatCount="indefinite"/></circle><text y="4" fill="#FF7B72" font-size="10">Rust</text></g>
    <g transform="translate(-60,-104)"><circle r="17" fill="#0B1018" stroke="#7EE787" stroke-width="2" filter="url(#sGlow)"/><circle r="17" fill="none" stroke="#7EE787" opacity="0.3"><animate attributeName="r" values="17;23;17" dur="2.3s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.4;0;0.4" dur="2.3s" repeatCount="indefinite"/></circle><text y="4" fill="#7EE787">C++</text></g>
    <g transform="translate(-120,0)"><circle r="17" fill="#0B1018" stroke="#FFB454" stroke-width="2" filter="url(#sGlow)"/><circle r="17" fill="none" stroke="#FFB454" opacity="0.3"><animate attributeName="r" values="17;23;17" dur="2.7s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.4;0;0.4" dur="2.7s" repeatCount="indefinite"/></circle><text y="4" fill="#FFB454" font-size="10">Py</text></g>
    <g transform="translate(-60,104)"><circle r="17" fill="#0B1018" stroke="#C9D1D9" stroke-width="2" filter="url(#sGlow)"/><circle r="17" fill="none" stroke="#C9D1D9" opacity="0.3"><animate attributeName="r" values="17;23;17" dur="2.6s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.4;0;0.4" dur="2.6s" repeatCount="indefinite"/></circle><text y="4" font-size="10">C</text></g>
    <g transform="translate(60,104)"><circle r="17" fill="#0B1018" stroke="#C678DD" stroke-width="2" filter="url(#sGlow)"/><circle r="17" fill="none" stroke="#C678DD" opacity="0.3"><animate attributeName="r" values="17;23;17" dur="2.4s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.4;0;0.4" dur="2.4s" repeatCount="indefinite"/></circle><text y="4" fill="#C678DD" font-size="10">JS</text></g>
  </g>

  <!-- FRAMEWORK nodes -->
  <g transform="translate(600,310)" class="lbl" font-size="9" fill="#E6EDF3" text-anchor="middle">
    <g transform="translate(200,0)"><circle r="17" fill="#0B1018" stroke="#4FD6FF" stroke-width="2" filter="url(#sGlow)"/><circle r="17" fill="none" stroke="#4FD6FF" opacity="0.3"><animate attributeName="r" values="17;23;17" dur="2.9s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.4;0;0.4" dur="2.9s" repeatCount="indefinite"/></circle><text y="3">Next</text></g>
    <g transform="translate(100,-173)"><circle r="17" fill="#0B1018" stroke="#61DAFB" stroke-width="2" filter="url(#sGlow)"/><circle r="17" fill="none" stroke="#61DAFB" opacity="0.3"><animate attributeName="r" values="17;23;17" dur="2.6s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.4;0;0.4" dur="2.6s" repeatCount="indefinite"/></circle><text y="3" fill="#61DAFB">React</text></g>
    <g transform="translate(-100,-173)"><circle r="17" fill="#0B1018" stroke="#EE4C2C" stroke-width="2" filter="url(#sGlow)"/><circle r="17" fill="none" stroke="#EE4C2C" opacity="0.3"><animate attributeName="r" values="17;23;17" dur="2.4s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.4;0;0.4" dur="2.4s" repeatCount="indefinite"/></circle><text y="3" fill="#EE4C2C" font-size="8">Torch</text></g>
    <g transform="translate(-200,0)"><circle r="17" fill="#0B1018" stroke="#FFB454" stroke-width="2" filter="url(#sGlow)"/><circle r="17" fill="none" stroke="#FFB454" opacity="0.3"><animate attributeName="r" values="17;23;17" dur="2.7s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.4;0;0.4" dur="2.7s" repeatCount="indefinite"/></circle><text y="3" fill="#FFB454">Flask</text></g>
    <g transform="translate(-100,173)"><circle r="17" fill="#0B1018" stroke="#7EE787" stroke-width="2" filter="url(#sGlow)"/><circle r="17" fill="none" stroke="#7EE787" opacity="0.3"><animate attributeName="r" values="17;23;17" dur="2.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.4;0;0.4" dur="2.5s" repeatCount="indefinite"/></circle><text y="3" fill="#7EE787" font-size="8">OpenGL</text></g>
    <g transform="translate(100,173)"><circle r="17" fill="#0B1018" stroke="#83CD29" stroke-width="2" filter="url(#sGlow)"/><circle r="17" fill="none" stroke="#83CD29" opacity="0.3"><animate attributeName="r" values="17;23;17" dur="2.8s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.4;0;0.4" dur="2.8s" repeatCount="indefinite"/></circle><text y="3" fill="#83CD29" font-size="8">Node</text></g>
  </g>

  <!-- INFRA nodes -->
  <g transform="translate(600,310)" class="lbl" font-size="9" fill="#E6EDF3" text-anchor="middle">
    <g transform="translate(270,0)"><circle r="17" fill="#0B1018" stroke="#F05032" stroke-width="2" filter="url(#sGlow)"/><circle r="17" fill="none" stroke="#F05032" opacity="0.3"><animate attributeName="r" values="17;23;17" dur="3s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.4;0;0.4" dur="3s" repeatCount="indefinite"/></circle><text y="3" fill="#F05032">Git</text></g>
    <g transform="translate(135,-234)"><circle r="17" fill="#0B1018" stroke="#2496ED" stroke-width="2" filter="url(#sGlow)"/><circle r="17" fill="none" stroke="#2496ED" opacity="0.3"><animate attributeName="r" values="17;23;17" dur="3.2s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.4;0;0.4" dur="3.2s" repeatCount="indefinite"/></circle><text y="3" fill="#2496ED" font-size="8">Docker</text></g>
    <g transform="translate(-135,-234)"><circle r="17" fill="#0B1018" stroke="#7EE787" stroke-width="2" filter="url(#sGlow)"/><circle r="17" fill="none" stroke="#7EE787" opacity="0.3"><animate attributeName="r" values="17;23;17" dur="2.9s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.4;0;0.4" dur="2.9s" repeatCount="indefinite"/></circle><text y="3" fill="#7EE787">WASM</text></g>
    <g transform="translate(-270,0)"><circle r="17" fill="#0B1018" stroke="#FFB454" stroke-width="2" filter="url(#sGlow)"/><circle r="17" fill="none" stroke="#FFB454" opacity="0.3"><animate attributeName="r" values="17;23;17" dur="3.1s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.4;0;0.4" dur="3.1s" repeatCount="indefinite"/></circle><text y="3" fill="#FFB454">Linux</text></g>
    <g transform="translate(-135,234)"><circle r="17" fill="#0B1018" stroke="#4FD6FF" stroke-width="2" filter="url(#sGlow)"/><circle r="17" fill="none" stroke="#4FD6FF" opacity="0.3"><animate attributeName="r" values="17;23;17" dur="2.7s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.4;0;0.4" dur="2.7s" repeatCount="indefinite"/></circle><text y="3" fill="#4FD6FF">Vercel</text></g>
    <g transform="translate(135,234)"><circle r="17" fill="#0B1018" stroke="#4FD6FF" stroke-width="2" filter="url(#sGlow)"/><circle r="17" fill="none" stroke="#4FD6FF" opacity="0.3"><animate attributeName="r" values="17;23;17" dur="2.8s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.4;0;0.4" dur="2.8s" repeatCount="indefinite"/></circle><text y="3" fill="#4FD6FF" font-size="8">VSCode</text></g>
  </g>

  <!-- orbit labels -->
  <g class="lbl" font-size="9" fill="#4A5668" letter-spacing="3">
    <text x="600" y="200" text-anchor="middle">LANGUAGES</text>
    <text x="600" y="120" text-anchor="middle">FRAMEWORKS</text>
    <text x="600" y="50" text-anchor="middle">INFRASTRUCTURE</text>
  </g>

  <text x="40" y="540" class="lbl" font-size="10" fill="#4A5668">18 nodes · 24 edges · 3 layers</text>
  <text x="1160" y="540" class="lbl" font-size="10" fill="#4A5668" text-anchor="end">resolved at runtime</text>
</svg>
