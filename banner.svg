<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="readelf -h memory.bin — Dhruv Narayan Bajaj">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0C1117"/>
      <stop offset="1" stop-color="#070A0F"/>
    </linearGradient>
    <linearGradient id="nameGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E6EDF3"/>
      <stop offset="0.5" stop-color="#9AA7B4"/>
      <stop offset="1" stop-color="#E6EDF3"/>
    </linearGradient>
    <linearGradient id="cyanFade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4FD6FF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#4FD6FF" stop-opacity="1"/>
      <stop offset="1" stop-color="#4FD6FF" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="vign" cx="0.5" cy="0.5" r="0.7">
      <stop offset="0.55" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.55"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#1B2330" stroke-width="1"/>
    </pattern>

    <clipPath id="reveal1"><rect x="0" y="40" width="430" height="40"><animate attributeName="width" from="0" to="430" dur="0.9s" begin="0.2s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.2 0.8 0.2 1"/></rect></clipPath>
    <clipPath id="reveal2"><rect x="0" y="84" width="560" height="40"><animate attributeName="width" from="0" to="560" dur="1.0s" begin="1.2s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.2 0.8 0.2 1"/></rect></clipPath>
    <clipPath id="reveal3"><rect x="0" y="108" width="640" height="40"><animate attributeName="width" from="0" to="640" dur="0.8s" begin="2.3s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.2 0.8 0.2 1"/></rect></clipPath>
    <clipPath id="nameReveal"><rect x="0" y="150" width="1200" height="120"><animate attributeName="width" from="0" to="1200" dur="0.7s" begin="3.1s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.25 0.8 0.2 1"/></rect></clipPath>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>

  <style>
    .mono{font-family:'JetBrains Mono','Fira Code','SF Mono',ui-monospace,'Cascadia Code',Menlo,Consolas,monospace;}
    .disp{font-family:'JetBrains Mono','Fira Code',ui-monospace,Menlo,Consolas,monospace;font-weight:700;letter-spacing:6px;}
    @media (prefers-reduced-motion:reduce){animate,animateTransform,animateMotion{display:none}}
  </style>

  <rect width="1200" height="340" fill="url(#bg)"/>
  <rect width="1200" height="340" fill="url(#grid)" opacity="0.55"/>

  <rect x="0" y="0" width="1200" height="2" fill="url(#cyanFade)" opacity="0.5">
    <animate attributeName="y" from="-4" to="344" dur="6.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.5;0" dur="6.5s" repeatCount="indefinite"/>
  </rect>
  <rect width="1200" height="340" fill="url(#vign)"/>

  <g stroke="#4FD6FF" stroke-width="2" fill="none" opacity="0.8">
    <path d="M24 24h34M24 24v34"/>
    <path d="M1176 24h-34M1176 24v34"/>
    <path d="M24 316h34M24 316v-34"/>
    <path d="M1176 316h-34M1176 316v-34"/>
  </g>

  <g>
    <circle cx="56" cy="300" r="4" fill="#7EE787"><animate attributeName="opacity" values="1;0.25;1" dur="1.6s" repeatCount="indefinite"/></circle>
    <text x="70" y="304" class="mono" font-size="12" fill="#7D8590">EXEC</text>
    <circle cx="140" cy="300" r="4" fill="#FFB454"><animate attributeName="opacity" values="1;0.3;1" dur="2.1s" begin="0.4s" repeatCount="indefinite"/></circle>
    <text x="154" y="304" class="mono" font-size="12" fill="#7D8590">LINK</text>
    <circle cx="224" cy="300" r="4" fill="#4FD6FF"><animate attributeName="opacity" values="1;0.3;1" dur="2.6s" begin="0.8s" repeatCount="indefinite"/></circle>
    <text x="238" y="304" class="mono" font-size="12" fill="#7D8590">LIVE</text>
  </g>
  <text x="1176" y="304" class="mono" font-size="12" fill="#7D8590" text-anchor="end">0x00000000dhruv · entry</text>

  <g class="mono" font-size="15">
    <text x="56" y="70" fill="#E6EDF3" clip-path="url(#reveal1)">$ readelf -h memory.bin</text>
    <text x="290" y="70" fill="#4FD6FF" opacity="0">
      ▋
      <animate attributeName="opacity" values="0;0;1;1;0;1" keyTimes="0;0.05;0.06;0.5;0.55;1" dur="1.1s" begin="0.2s" fill="freeze"/>
    </text>
    <text x="56" y="100" fill="#7D8590" clip-path="url(#reveal2)">Magic: 7f 45 4c 46 02 01 01 00 · ELF64 · little-endian</text>
    <text x="56" y="128" fill="#7D8590" clip-path="url(#reveal3)">Type: EXEC · Machine: Next.js/TS, Rust, C++, OpenGL, PyTorch</text>
  </g>

  <g clip-path="url(#nameReveal)">
    <text x="600" y="232" class="disp" font-size="62" fill="#FF3B6B" text-anchor="middle" opacity="0.85" filter="url(#glow)">
      DHRUV NARAYAN BAJAJ
      <animateTransform attributeName="transform" type="translate" values="0 0;-4 0;3 -1;0 0;-5 1;0 0" dur="3.4s" begin="3.2s" repeatCount="indefinite" calcMode="discrete"/>
    </text>
    <text x="600" y="232" class="disp" font-size="62" fill="#4FD6FF" text-anchor="middle" opacity="0.85" filter="url(#glow)">
      DHRUV NARAYAN BAJAJ
      <animateTransform attributeName="transform" type="translate" values="0 0;4 0;-3 1;0 0;5 -1;0 0" dur="3.4s" begin="3.2s" repeatCount="indefinite" calcMode="discrete"/>
    </text>
    <text x="600" y="232" class="disp" font-size="62" fill="url(#nameGrad)" text-anchor="middle">DHRUV NARAYAN BAJAJ</text>
  </g>

  <line x1="120" y1="254" x2="1080" y2="254" stroke="#1F2937" stroke-width="2"/>
  <rect x="120" y="252" width="0" height="4" fill="#4FD6FF">
    <animate attributeName="x" values="120;1080;120" dur="4.2s" begin="3.4s" repeatCount="indefinite"/>
    <animate attributeName="width" values="0;260;0" dur="4.2s" begin="3.4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;1;0" dur="4.2s" begin="3.4s" repeatCount="indefinite"/>
  </rect>

  <text x="600" y="278" class="mono" font-size="13" fill="#7D8590" text-anchor="middle">full-stack engineer · systems programmer · ml builder</text>
</svg>
