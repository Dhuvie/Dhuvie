<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="Dhruv Narayan Bajaj">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0A0F16"/>
      <stop offset="0.5" stop-color="#070B10"/>
      <stop offset="1" stop-color="#040608"/>
    </linearGradient>
    <linearGradient id="nameGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9AA7B4"/>
      <stop offset="0.2" stop-color="#E6EDF3"/>
      <stop offset="0.5" stop-color="#4FD6FF"/>
      <stop offset="0.8" stop-color="#E6EDF3"/>
      <stop offset="1" stop-color="#9AA7B4"/>
    </linearGradient>
    <linearGradient id="scanG" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4FD6FF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#4FD6FF" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#4FD6FF" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="vign" cx="0.5" cy="0.5" r="0.7">
      <stop offset="0.4" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.7"/>
    </radialGradient>
    <radialGradient id="corePulse" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#4FD6FF" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#4FD6FF" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="bigGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#101820" stroke-width="1"/>
    </pattern>
  </defs>
  <style>
    .mono{font-family:'JetBrains Mono','Fira Code',ui-monospace,Menlo,Consolas,monospace;}
    .disp{font-family:'JetBrains Mono','Fira Code',ui-monospace,Menlo,Consolas,monospace;font-weight:700;letter-spacing:4px;}
    @media (prefers-reduced-motion:reduce){animate,animateTransform,animateMotion{display:none}}
  </style>

  <rect width="1200" height="340" fill="url(#bg)"/>
  <rect width="1200" height="340" fill="url(#grid)" opacity="0.3"/>

  <!-- ambient core glow behind name -->
  <ellipse cx="600" cy="210" rx="450" ry="70" fill="url(#corePulse)" filter="url(#bigGlow)">
    <animate attributeName="opacity" values="0.3;0.6;0.3" dur="4s" repeatCount="indefinite"/>
  </ellipse>

  <!-- drifting scan beams -->
  <rect x="0" y="0" width="1200" height="2" fill="url(#scanG)" opacity="0.4">
    <animate attributeName="y" values="-5;345" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.6;0" dur="6s" repeatCount="indefinite"/>
  </rect>
  <rect x="0" y="0" width="1200" height="1" fill="url(#scanG)" opacity="0.3">
    <animate attributeName="y" values="-5;345" dur="9s" begin="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.4;0" dur="9s" begin="3s" repeatCount="indefinite"/>
  </rect>

  <rect width="1200" height="340" fill="url(#vign)"/>

  <!-- HUD corner brackets drawing in -->
  <g stroke="#4FD6FF" stroke-width="2" fill="none" opacity="0.6" stroke-linecap="round">
    <path d="M24 24h34M24 24v34" stroke-dasharray="68" stroke-dashoffset="68">
      <animate attributeName="stroke-dashoffset" from="68" to="0" dur="0.5s" begin="0.1s" fill="freeze"/>
    </path>
    <path d="M1176 24h-34M1176 24v34" stroke-dasharray="68" stroke-dashoffset="68">
      <animate attributeName="stroke-dashoffset" from="68" to="0" dur="0.5s" begin="0.2s" fill="freeze"/>
    </path>
    <path d="M24 316h34M24 316v-34" stroke-dasharray="68" stroke-dashoffset="68">
      <animate attributeName="stroke-dashoffset" from="68" to="0" dur="0.5s" begin="0.3s" fill="freeze"/>
    </path>
    <path d="M1176 316h-34M1176 316v-34" stroke-dasharray="68" stroke-dashoffset="68">
      <animate attributeName="stroke-dashoffset" from="68" to="0" dur="0.5s" begin="0.4s" fill="freeze"/>
    </path>
  </g>

  <!-- status LEDs -->
  <g class="mono" font-size="12" fill="#5B6675">
    <circle cx="56" cy="300" r="4" fill="#7EE787" filter="url(#glow)">
      <animate attributeName="opacity" values="1;0.2;1" dur="1.4s" repeatCount="indefinite"/>
    </circle>
    <text x="70" y="304">EXEC</text>
    <circle cx="140" cy="300" r="4" fill="#FFB454" filter="url(#glow)">
      <animate attributeName="opacity" values="1;0.2;1" dur="1.8s" begin="0.3s" repeatCount="indefinite"/>
    </circle>
    <text x="154" y="304">LINK</text>
    <circle cx="224" cy="300" r="4" fill="#4FD6FF" filter="url(#glow)">
      <animate attributeName="opacity" values="1;0.2;1" dur="2.2s" begin="0.6s" repeatCount="indefinite"/>
    </circle>
    <text x="238" y="304">LIVE</text>
  </g>
  <text x="1176" y="304" class="mono" font-size="12" fill="#5B6675" text-anchor="end">0x00000000dhruv · entry</text>

  <!-- boot lines typing in -->
  <g class="mono" font-size="14">
    <text x="56" y="70" fill="#7D8590" opacity="0">
      <tspan fill="#5B6675">$ </tspan><tspan fill="#E6EDF3">readelf -h memory.bin</tspan>
      <animate attributeName="opacity" values="0;1" dur="0.3s" begin="0.5s" fill="freeze"/>
    </text>
    <text x="56" y="98" fill="#5B6675" opacity="0">
      Magic: <tspan fill="#4FD6FF">7f 45 4c 46</tspan> · ELF64 · little-endian
      <animate attributeName="opacity" values="0;1" dur="0.3s" begin="1.0s" fill="freeze"/>
    </text>
    <text x="56" y="126" fill="#5B6675" opacity="0">
      Type: <tspan fill="#7EE787">EXEC</tspan> · Machine: Next.js/TS, Rust, C++, OpenGL, PyTorch
      <animate attributeName="opacity" values="0;1" dur="0.3s" begin="1.5s" fill="freeze"/>
    </text>
  </g>

  <!-- blinking cursor -->
  <rect x="56" y="138" width="9" height="16" fill="#4FD6FF" filter="url(#glow)">
    <animate attributeName="opacity" values="1;0;1" dur="0.7s" begin="1.8s" repeatCount="indefinite"/>
  </rect>

  <!-- signal lock lines (brief crosshair before name) -->
  <g stroke="#4FD6FF" stroke-width="1" opacity="0">
    <line x1="600" y1="160" x2="600" y2="260"/>
    <line x1="200" y1="210" x2="1000" y2="210"/>
    <circle cx="600" cy="210" r="60" fill="none"/>
    <animate attributeName="opacity" values="0;0.4;0" keyTimes="0;0.5;1" dur="1s" begin="2.0s" fill="freeze"/>
  </g>

  <!-- THE NAME with glitch reveal -->
  <g transform="translate(600,225)" text-anchor="middle">
    <!-- RGB glitch shadows -->
    <text class="disp" font-size="56" fill="#FF3B6B" opacity="0" filter="url(#glow)">
      DHRUV NARAYAN BAJAJ
      <animate attributeName="opacity" values="0;0.6;0.3;0.5;0.2;0.4;0;0;0" keyTimes="0;0.01;0.04;0.08;0.12;0.16;0.2;0.95;1" dur="5s" begin="2.3s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="0,0;-2,1;1,-1;0,0;-3,1;0,0;0,0;0,0;0,0" dur="0.2s" begin="2.3s" repeatCount="indefinite"/>
    </text>
    <text class="disp" font-size="56" fill="#4FD6FF" opacity="0" filter="url(#glow)">
      DHRUV NARAYAN BAJAJ
      <animate attributeName="opacity" values="0;0.6;0.3;0.5;0.2;0.4;0;0;0" keyTimes="0;0.01;0.04;0.08;0.12;0.16;0.2;0.95;1" dur="5s" begin="2.3s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="0,0;2,-1;-1,1;0,0;3,-1;0,0;0,0;0,0;0,0" dur="0.2s" begin="2.3s" repeatCount="indefinite"/>
    </text>
    <!-- main name -->
    <text class="disp" font-size="56" fill="url(#nameGrad)" opacity="0" filter="url(#glow)">
      DHRUV NARAYAN BAJAJ
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.3;0.5;1" dur="3s" begin="2.3s" fill="freeze"/>
    </text>
  </g>

  <!-- underline draw + sweep -->
  <line x1="200" y1="250" x2="1000" y2="250" stroke="#141C28" stroke-width="2"/>
  <rect x="200" y="248" width="0" height="3" fill="#4FD6FF" filter="url(#glow)">
    <animate attributeName="width" from="0" to="800" dur="0.8s" begin="3.5s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.2 0.8 0.2 1"/>
  </rect>
  <rect x="200" y="248" width="160" height="3" fill="url(#scanG)" opacity="0">
    <animate attributeName="x" values="200;840;200" dur="5s" begin="4.3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.9;0" dur="5s" begin="4.3s" repeatCount="indefinite"/>
  </rect>

  <text x="600" y="278" class="mono" font-size="13" fill="#5B6675" text-anchor="middle" opacity="0" letter-spacing="3">
    full-stack engineer · systems programmer · ml builder
    <animate attributeName="opacity" values="0;1" dur="0.5s" begin="3.8s" fill="freeze"/>
  </text>

  <!-- particle burst on name reveal -->
  <g fill="#4FD6FF" opacity="0.6">
    <circle r="1.5" filter="url(#glow)"><animateMotion dur="6s" begin="2.5s" repeatCount="indefinite" path="M600,210 L300,120"/></circle>
    <circle r="1" fill="#7EE787" filter="url(#glow)"><animateMotion dur="7s" begin="2.8s" repeatCount="indefinite" path="M600,210 L900,140"/></circle>
    <circle r="1.5" fill="#FFB454" filter="url(#glow)"><animateMotion dur="8s" begin="3.0s" repeatCount="indefinite" path="M600,210 L200,250"/></circle>
    <circle r="1" filter="url(#glow)"><animateMotion dur="6.5s" begin="3.2s" repeatCount="indefinite" path="M600,210 L1000,220"/></circle>
    <circle r="1.5" fill="#B084EB" filter="url(#glow)"><animateMotion dur="7.5s" begin="3.5s" repeatCount="indefinite" path="M600,210 L500,100"/></circle>
    <circle r="1" filter="url(#glow)"><animateMotion dur="8.5s" begin="3.8s" repeatCount="indefinite" path="M600,210 L700,280"/></circle>
  </g>
</svg>
